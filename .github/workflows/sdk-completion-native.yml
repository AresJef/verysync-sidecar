name: SDK completion native evidence

on:
  push:
    branches:
      - 'ci/sdk-completion-full-20261128*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-completion-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package the selected SDK commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and identify the exact archive
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 fetch --locked
          python scripts/prepare-control-reliability-consumer.py --toolchain 1.85.0 \
            --package-only --work "$RUNNER_TEMP/sdk-package-work" \
            --evidence "$RUNNER_TEMP/sdk-package"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-completion-package
          path: ${{ runner.temp }}/sdk-package
          if-no-files-found: error

  api-compatibility:
    name: Public API compatibility with the published crate and SDK baseline
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
        with:
          name: sdk-completion-package
          path: ${{ runner.temp }}/sdk-completion-package
      - name: Prepare pinned compilers and the exact API checker
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.85.0 fetch --locked
          python scripts/prepare-api-compatibility-tool.py --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Check minimal, default, and all features against the published package
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            https://static.crates.io/crates/verysync-sidecar/verysync-sidecar-0.1.1.crate \
            --output "$RUNNER_TEMP/published-0.1.1.crate"
          python scripts/check-control-candidate-compatibility.py \
            --candidate "$RUNNER_TEMP/sdk-completion-package/candidate.crate" \
            --identity "$RUNNER_TEMP/sdk-completion-package/package.json" \
            --baseline "$RUNNER_TEMP/published-0.1.1.crate" --checker "$VERYSYNC_SEMVER_CHECKER" \
            --cargo "$(command -v cargo)" --parent "$RUNNER_TEMP" --evidence "$RUNNER_TEMP/sdk-api/published"
      - name: Check the same profiles against the exact RC10 starting crate
        if: always() && env.VERYSYNC_SEMVER_CHECKER != ''
        run: |
          baseline=5d2e04f8ed8ce0e0ed5978613ffab10cb26c02ab
          git fetch --no-tags --depth=1 https://github.com/AresJef/verysync-sidecar.git "$baseline"
          git worktree add --detach "$RUNNER_TEMP/sdk-rc10" "$baseline"
          trap 'git worktree remove "$RUNNER_TEMP/sdk-rc10"' EXIT
          (
            cd "$RUNNER_TEMP/sdk-rc10"
            cargo +1.85.0 package --locked --offline --no-verify --target-dir "$RUNNER_TEMP/sdk-rc10-target"
          )
          python scripts/check-control-candidate-compatibility.py \
            --candidate "$RUNNER_TEMP/sdk-completion-package/candidate.crate" \
            --identity "$RUNNER_TEMP/sdk-completion-package/package.json" \
            --baseline "$RUNNER_TEMP/sdk-rc10-target/package/verysync-sidecar-0.1.2-rc.10.crate" \
            --baseline-identity sdk-completion-rc10 --checker "$VERYSYNC_SEMVER_CHECKER" \
            --cargo "$(command -v cargo)" --parent "$RUNNER_TEMP" --evidence "$RUNNER_TEMP/sdk-api/rc10"
      - name: Run independently unpacked examples under all three feature profiles
        if: always() && env.VERYSYNC_SEMVER_CHECKER != ''
        run: |
          set -o pipefail
          for profile in minimal default all; do
            proof="$RUNNER_TEMP/sdk-api/profiles/$profile"
            settings="$RUNNER_TEMP/sdk-example-$profile.env"
            python scripts/prepare-control-reliability-consumer.py --toolchain 1.85.0 \
              --candidate "$RUNNER_TEMP/sdk-completion-package/candidate.crate" \
              --candidate-identity "$RUNNER_TEMP/sdk-completion-package/package.json" \
              --work "$RUNNER_TEMP/sdk-example-$profile" --evidence "$proof" \
              --github-env "$settings" --profile "$profile"
            set -a
            source "$settings"
            set +a
            for program in "$VERYSYNC_TEST_RECOVERY_EXAMPLE" "$VERYSYNC_TEST_OBSERVATION_EXAMPLE" "$VERYSYNC_TEST_PREVIEW_EXAMPLE" "$VERYSYNC_TEST_PREFLIGHT_EXAMPLE" "$VERYSYNC_TEST_MANAGED_EXAMPLE"; do
              "$program" --help | tee "$proof/$(basename "$program").help"
            done
            cargo +1.85.0 test --locked --offline --features engine-tests --test control_reliability_engine \
              package_consumer_distinguishes_acknowledgement_loss_and_later_changes -- --nocapture \
              | tee "$proof/control-recovery.log"
            cargo +1.85.0 test --locked --offline --test control_preview_contract \
              package_consumer_requires_approval_before_one_scoped_write -- --nocapture \
              | tee "$proof/control-preview.log"
            python scripts/check-control-corrections-output.py \
              --listener "$VERYSYNC_TEST_RECOVERY_EXAMPLE" --preview "$VERYSYNC_TEST_PREVIEW_EXAMPLE" \
              | tee "$proof/control-corrections-output.jsonl"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sdk-completion-api-compatibility-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-api
          if-no-files-found: error

  native-upgrade:
    name: SDK upgrade workflow (${{ matrix.package }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: linux-amd64-standard, runner: ubuntu-24.04, rust: x86_64-unknown-linux-gnu, observe: '1'}
          - {package: linux-arm64-standard, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, observe: '1'}
          - {package: macos-amd64-standard, runner: macos-15-intel, rust: x86_64-apple-darwin, observe: '1'}
          - {package: macos-arm64-standard, runner: macos-15, rust: aarch64-apple-darwin, observe: '1'}
          - {package: windows-amd64-standard, runner: windows-2022, rust: x86_64-pc-windows-msvc, observe: '0'}
          - {package: windows-arm64-standard, runner: windows-11-arm, rust: aarch64-pc-windows-msvc, observe: '0'}
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
      VERYSYNC_TEST_REQUIRE_DIRECT_REQUEST_CAPTURE: ${{ matrix.observe }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check runner identity and prepare the official programs
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/sdk-upgrade-evidence"
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV | tee "$RUNNER_TEMP/sdk-upgrade-evidence/rust-version.log"
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}" \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" | tee "$RUNNER_TEMP/sdk-upgrade-evidence/target.json"
          python scripts/prepare-test-engine.py prepare --upgrade-source --package "${{ matrix.package }}" \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" | tee "$RUNNER_TEMP/sdk-upgrade-evidence/previous.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
        with:
          name: sdk-completion-package
          path: ${{ runner.temp }}/sdk-completion-package
      - name: Build an independent consumer of the verified crate
        id: external_consumer
        run: |
          set -o pipefail
          python scripts/prepare-upgrade-receipt-consumer.py --toolchain "$TEST_TOOLCHAIN" \
            --work "$RUNNER_TEMP/sdk-upgrade-consumer" \
            --identity "$RUNNER_TEMP/sdk-completion-package/package.json" \
            --crate "$RUNNER_TEMP/sdk-completion-package/candidate.crate" \
            --sdk-completion \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/consumer.json"
      - name: Build the exact examples for independent application processes
        id: external_examples
        run: |
          python scripts/prepare-control-reliability-consumer.py --toolchain "$TEST_TOOLCHAIN" \
            --candidate "$RUNNER_TEMP/sdk-completion-package/candidate.crate" \
            --candidate-identity "$RUNNER_TEMP/sdk-completion-package/package.json" \
            --work "$RUNNER_TEMP/sdk-example-client" \
            --evidence "$RUNNER_TEMP/sdk-upgrade-evidence/example-client" --github-env "$GITHUB_ENV"
      - name: Verify the query and retry contract from the unpacked candidate
        run: |
          set -o pipefail
          cargo +"$TEST_TOOLCHAIN" test --locked --offline \
            --manifest-path "$RUNNER_TEMP/sdk-upgrade-consumer/consumer/Cargo.toml" \
            --test upgrade_receipt_contract -- --nocapture \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/http-contract.log"
      - name: Install and verify the pinned upgrade on the native engine
        run: |
          set -o pipefail
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target upgrade_engine --test-filter native_business_ \
            --upgrade-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/native"
          python -c 'import pathlib, sys; lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"); assert "test result: ok. 8 passed;" in lines' \
            "$RUNNER_TEMP/sdk-upgrade-evidence/native/upgrade-engine.log"
      - name: Prepare the Linux process witness
        if: runner.os == 'Linux'
        run: |
          if ! command -v strace >/dev/null; then
            strace_dir=$(mktemp -d "$RUNNER_TEMP/sdk-strace.XXXXXX")
            (
              cd "$strace_dir"
              apt-get download strace
              dpkg-deb -x ./strace_*.deb "$strace_dir/unpacked"
            )
            printf '%s\n' "$strace_dir/unpacked/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Count SDK process creation independently of the engine
        run: |
          result=0
          trace="$RUNNER_TEMP/sdk-upgrade-process-trace"
          raw="$RUNNER_TEMP/sdk-upgrade-evidence/process-witness"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target upgrade_engine --test-filter native_business_install_reports_verified_target_after_lost_reply \
            --upgrade-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --upgrade-process-trace "$trace" --evidence-dir "$raw" || result=1
          if [ -f "$trace/observer.stderr" ]; then
            cp "$trace/observer.stderr" "$raw/observer.stderr"
          fi
          python scripts/trace-upgrade-recovery.py --verify --trace "$trace/intermediate.json" \
            --log "$raw/upgrade-engine.log" --output "$raw/independent-process-witness.json" \
            --scoped-trace "$raw/owned-process-events.json" || result=1
          exit "$result"
      - name: Verify the two isolated executable trees exited
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          python scripts/prepare-test-engine.py check-cleanup | tee "$RUNNER_TEMP/sdk-upgrade-evidence/target-cleanup.log" || result=1
          if [ -n "$VERYSYNC_TEST_UPGRADE_SOURCE_BINARY" ]; then
            python scripts/prepare-test-engine.py check-cleanup --upgrade-source | tee "$RUNNER_TEMP/sdk-upgrade-evidence/previous-cleanup.log" || result=1
          fi
          exit "$result"
      - name: Verify the real Windows ARM64 shutdown path
        if: always() && matrix.package == 'windows-arm64-standard' && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target control_observation_engine --test-filter native_shutdown_receipt_ \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/shutdown-control"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target sync_observation \
            --test-filter actual_folder_order_and_specific_priority_change_preserve_samples \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/shutdown-folder-priority"
      - name: Verify Windows ARM64 shutdown fixture cleanup
        if: always() && matrix.package == 'windows-arm64-standard' && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          python scripts/prepare-test-engine.py check-cleanup \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/windows-shutdown-cleanup.log"
      - name: Verify the configured-folder workflow and actual index readback
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --test transport_contract \
            folder_workflow_contracts -- --nocapture \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/folder-contract.log"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target engine_control --test-filter folder_workflow_separates_paused_configuration_from_live_state \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/folder-native"
      - name: Verify exact restart admission and independent download bytes
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target managed_instance --test-filter managed_restart_workflow_keeps_shutdown_evidence_and_rejects_replaced_identity \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/restart-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target file_transfer_engine --test-filter verified_download_native_ \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/verified-download-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target file_transfer_engine --test-filter verified_upload_native_ \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/verified-upload-native" || result=1
          exit "$result"
      - name: Verify account, folder and Local Sync workflows using the independent package
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          consumer="$RUNNER_TEMP/sdk-upgrade-consumer/consumer"
          for selector in official_account_ license_ audit_workflow_ folder_workflow_contracts local_sync_workflow_contracts gui_login_outcome device_workflow_ verified_upload_observes verified_file_relocation_ verified_resource_removal_ verified_configuration_ folder_peer_workflow_; do
            cargo +"$TEST_TOOLCHAIN" test --locked --offline --manifest-path "$consumer/Cargo.toml" \
              --test transport_contract "$selector" -- --nocapture \
              | tee "$RUNNER_TEMP/sdk-upgrade-evidence/$selector.log" || result=1
          done
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target engine_control --test-filter folder_unregistration_workflow_ \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/unregistration-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target local_sync_engine --test-filter local_sync_business_native_ \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/local-sync-workflow-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target engine_control --test-filter folder_registration_workflow_ \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/registration-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target authentication_engine --test-filter gui_password_sessions_logout_and_api_key_management_are_independent \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/gui-auth-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target devices --test-filter actual_receipt_disconnect_and_remove_preserves_files \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/device-workflow-native" || result=1
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --manifest-path "$consumer/Cargo.toml" \
            --test events_contract scan_ -- --nocapture \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/scan-contract.log" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target sync_observation --test-filter actual_scan_scopes_schedule_and_watcher_preserve_files \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/scan-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target p2p_three_nodes --test-filter actual_delivery_batch_waits_for_the_late_receiver_and_checks_bytes \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/batch-delivery-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target configuration_engine --test-filter full_configuration_save_preserves_sections_and_rejects_stale_snapshots \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/configuration-save-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target local_sync_advanced_engine --test-filter public_two_way_manual_resolution_changes_only_preview_until_explicit_run \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/conflict-resolution-native" || result=1
          exit "$result"
      - name: Verify shared folders, native scheduling, ignore rules, and owned backup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          consumer="$RUNNER_TEMP/sdk-upgrade-consumer/consumer"
          while read -r target selector; do
            evidence_name="${selector%::}"
            python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
              --test-target "$target" --test-filter "$selector" \
              --sdk-completion-consumer "$consumer" \
              --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/$evidence_name" || result=1
          done <<'CASES'
          configuration_engine native_general_preferences_preserve_sections_disable_progress_and_change_priority_after_restart
          network actual_private_udp_only_peers_and_disabled_tracker_nat_observations
          network actual_owned_private_relay_session_with_tcp_and_udp_disabled
          p2p_three_nodes introducer_cases::
          file_history_engine public_version_policy_archives_remote_changes_and_restores_old_bytes
          file_history_engine public_directory_restore_selects_nested_and_explicit_root_versions
          local_sync_engine public_local_sync_preview_execution_and_registration_changes_preserve_actual_data
          engine_control actual_target_directory_helpers_create_read_and_retain_only_explicit_synthetic_paths
          configuration_engine native_default_versioning_inheritance_selects_real_archives_and_retains_old_folders
          maintenance_engine public_core_errors_logs_levels_and_owned_diagnostics
          local_sync_repair_engine public_marker_rebuild_and_baseline_recovery_restore_real_safety_guards_without_implicit_run
          upgrade_engine offline_backup_restore_preserves_old_index_and_rejects_corruption
          invitations actual_folder_offer_dismiss_ignore_unignore_and_explicit_read_only_acceptance
          sync_observation actual_ignore_replace_parse_rejection_reset_and_restart_preserve_files
          configuration_engine native_default_ignore_template_and_explicit_application_preserve_rules_files_and_restart
          sync_observation actual_receiveonly_revert_and_marker_repair_restore_owned_data
          sync_observation actual_sendonly_override_restores_remote_data_and_preserves_authority
          sync_observation actual_folder_order_and_specific_priority_change_preserve_samples
          CASES
          exit "$result"
      - name: Verify file-manager mutations and same-second restore protection
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          consumer="$RUNNER_TEMP/sdk-upgrade-consumer/consumer"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target file_mutation_engine --test-filter public_ \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/file-mutation-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target file_history_engine --test-filter public_same_second_restore_refusal_preserves_selected_old_archive_and_current_bytes \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/restore-guard-native" || result=1
          exit "$result"
      - name: Select separate x64 protocol peer tools on Windows ARM
        if: always() && matrix.package == 'windows-arm64-standard'
        id: storage_tools_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          update-environment: false
      - name: Prepare the private storage protocol peers
        id: storage_peers
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        env:
          VERYSYNC_STORAGE_BASE_PYTHON: ${{ steps.storage_tools_python.outputs.python-path }}
        run: |
          set -o pipefail
          python scripts/prepare-storage-test-environment.py \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/storage-peer-runtime.log"
      - name: Verify exact Local Sync controls on the four storage peers
        if: always() && env.VERYSYNC_STORAGE_TEST_PYTHON != '' && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          cargo +"$TEST_TOOLCHAIN" test --locked --offline \
            --manifest-path "$RUNNER_TEMP/sdk-upgrade-consumer/consumer/Cargo.toml" \
            --test transport_contract local_sync_run_control_ -- --nocapture \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/local-sync-control-contract.log"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target local_sync_runtime_engine --test-filter controls_ \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/local-sync-controls-native"
      - name: Bind all 74 operations to exact tests of the external crate
        if: always() && steps.external_consumer.outcome == 'success' &&
          steps.external_examples.outcome == 'success' && steps.storage_peers.outcome == 'success'
        run: |
          python scripts/run-sdk-operation-evidence.py --toolchain "$TEST_TOOLCHAIN" \
            --platform "${{ matrix.package }}" \
            --consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --consumer-identity "$RUNNER_TEMP/sdk-upgrade-evidence/consumer.json" \
            --package-identity "$RUNNER_TEMP/sdk-completion-package/package.json" \
            --crate "$RUNNER_TEMP/sdk-completion-package/candidate.crate" \
            --output "$RUNNER_TEMP/sdk-upgrade-evidence/operations"
      - name: Compile the exact external Linux host-setting case as the runner
        if: always() && runner.os == 'Linux' && steps.external_consumer.outcome == 'success'
        id: linux_host_case
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -o pipefail
          driver="$PWD/scripts/host-test-cargo.py"
          cd "$RUNNER_TEMP/sdk-upgrade-consumer/consumer"
          python "$driver" prepare --toolchain "$TEST_TOOLCHAIN" \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/linux-host-case-build.log"
      - name: Verify the real Linux setting and restore its original value
        if: always() && steps.linux_host_case.outcome == 'success'
        env:
          VERYSYNC_TEST_ALLOW_HOST_CONFIGURATION: github-actions-isolated-linux-vm
        run: |
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --cargo "$VERYSYNC_HOST_TEST_CARGO_SHIM" --test-target host_control_engine \
            --test-filter privileged_native_watch_limit_is_raised_then_independently_restored \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/linux-host-case"
      - name: Confirm final owned process cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          python scripts/prepare-test-engine.py check-cleanup \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/final-target-cleanup.log" || result=1
          python scripts/prepare-test-engine.py check-cleanup --upgrade-source \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/final-previous-cleanup.log" || result=1
          exit "$result"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sdk-upgrade-evidence-${{ matrix.package }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-upgrade-evidence
          if-no-files-found: error
