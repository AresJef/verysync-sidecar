name: SDK completion native evidence

on:
  push:
    branches:
      - 'ci/sdk-completion-full-20261128*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-completion-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package the selected SDK commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and identify the exact archive
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 fetch --locked
          python scripts/prepare-control-reliability-consumer.py --toolchain 1.85.0 \
            --package-only --work "$RUNNER_TEMP/sdk-package-work" \
            --evidence "$RUNNER_TEMP/sdk-package"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-completion-package
          path: ${{ runner.temp }}/sdk-package
          if-no-files-found: error

  native-upgrade:
    name: SDK upgrade workflow (${{ matrix.package }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: linux-amd64-standard, runner: ubuntu-24.04, rust: x86_64-unknown-linux-gnu}
          - {package: linux-arm64-standard, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu}
          - {package: macos-amd64-standard, runner: macos-15-intel, rust: x86_64-apple-darwin}
          - {package: macos-arm64-standard, runner: macos-15, rust: aarch64-apple-darwin}
          - {package: windows-amd64-standard, runner: windows-2022, rust: x86_64-pc-windows-msvc}
          - {package: windows-arm64-standard, runner: windows-11-arm, rust: aarch64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check runner identity and prepare the official programs
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/sdk-upgrade-evidence"
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV | tee "$RUNNER_TEMP/sdk-upgrade-evidence/rust-version.log"
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}" \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" | tee "$RUNNER_TEMP/sdk-upgrade-evidence/target.json"
          python scripts/prepare-test-engine.py prepare --upgrade-source --package "${{ matrix.package }}" \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" | tee "$RUNNER_TEMP/sdk-upgrade-evidence/previous.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
        with:
          name: sdk-completion-package
          path: ${{ runner.temp }}/sdk-completion-package
      - name: Build an independent consumer of the verified crate
        run: |
          set -o pipefail
          python scripts/prepare-upgrade-receipt-consumer.py --toolchain "$TEST_TOOLCHAIN" \
            --work "$RUNNER_TEMP/sdk-upgrade-consumer" \
            --identity "$RUNNER_TEMP/sdk-completion-package/package.json" \
            --crate "$RUNNER_TEMP/sdk-completion-package/candidate.crate" \
            --sdk-completion \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/consumer.json"
      - name: Verify the query and retry contract from the unpacked candidate
        run: |
          set -o pipefail
          cargo +"$TEST_TOOLCHAIN" test --locked --offline \
            --manifest-path "$RUNNER_TEMP/sdk-upgrade-consumer/consumer/Cargo.toml" \
            --test upgrade_receipt_contract -- --nocapture \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/http-contract.log"
      - name: Install and verify the pinned upgrade on the native engine
        run: |
          set -o pipefail
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target upgrade_engine --test-filter native_business_ \
            --upgrade-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/native"
          python -c 'import pathlib, sys; lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"); assert "test result: ok. 8 passed;" in lines' \
            "$RUNNER_TEMP/sdk-upgrade-evidence/native/upgrade-engine.log"
      - name: Prepare the Linux process witness
        if: runner.os == 'Linux'
        run: |
          if ! command -v strace >/dev/null; then
            strace_dir=$(mktemp -d "$RUNNER_TEMP/sdk-strace.XXXXXX")
            (
              cd "$strace_dir"
              apt-get download strace
              dpkg-deb -x ./strace_*.deb "$strace_dir/unpacked"
            )
            printf '%s\n' "$strace_dir/unpacked/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Count SDK process creation independently of the engine
        run: |
          result=0
          trace="$RUNNER_TEMP/sdk-upgrade-process-trace"
          raw="$RUNNER_TEMP/sdk-upgrade-evidence/process-witness"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target upgrade_engine --test-filter native_business_install_reports_verified_target_after_lost_reply \
            --upgrade-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --upgrade-process-trace "$trace" --evidence-dir "$raw" || result=1
          if [ -f "$trace/observer.stderr" ]; then
            cp "$trace/observer.stderr" "$raw/observer.stderr"
          fi
          python scripts/trace-upgrade-recovery.py --verify --trace "$trace/intermediate.json" \
            --log "$raw/upgrade-engine.log" --output "$raw/independent-process-witness.json" \
            --scoped-trace "$raw/owned-process-events.json" || result=1
          exit "$result"
      - name: Verify the two isolated executable trees exited
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          python scripts/prepare-test-engine.py check-cleanup | tee "$RUNNER_TEMP/sdk-upgrade-evidence/target-cleanup.log" || result=1
          if [ -n "$VERYSYNC_TEST_UPGRADE_SOURCE_BINARY" ]; then
            python scripts/prepare-test-engine.py check-cleanup --upgrade-source | tee "$RUNNER_TEMP/sdk-upgrade-evidence/previous-cleanup.log" || result=1
          fi
          exit "$result"
      - name: Verify the real Windows ARM64 shutdown path
        if: always() && matrix.package == 'windows-arm64-standard' && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target control_observation_engine --test-filter native_shutdown_receipt_ \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/shutdown-control"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target sync_observation \
            --test-filter actual_folder_order_and_specific_priority_change_preserve_samples \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/shutdown-folder-priority"
      - name: Verify Windows ARM64 shutdown fixture cleanup
        if: always() && matrix.package == 'windows-arm64-standard' && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          python scripts/prepare-test-engine.py check-cleanup \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/windows-shutdown-cleanup.log"
      - name: Verify the configured-folder workflow and actual index readback
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --test transport_contract \
            folder_workflow_contracts -- --nocapture \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/folder-contract.log"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target engine_control --test-filter folder_workflow_separates_paused_configuration_from_live_state \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/folder-native"
      - name: Verify exact restart admission and independent download bytes
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target managed_instance --test-filter managed_restart_workflow_keeps_shutdown_evidence_and_rejects_replaced_identity \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/restart-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target file_transfer_engine --test-filter verified_download_native_ \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/verified-download-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target file_transfer_engine --test-filter verified_upload_native_ \
            --sdk-completion-consumer "$RUNNER_TEMP/sdk-upgrade-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/verified-upload-native" || result=1
          exit "$result"
      - name: Verify account, folder and Local Sync workflows using the independent package
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          consumer="$RUNNER_TEMP/sdk-upgrade-consumer/consumer"
          for selector in official_account_ license_ audit_workflow_ folder_workflow_contracts local_sync_workflow_contracts gui_login_outcome device_workflow_ verified_upload_observes; do
            cargo +"$TEST_TOOLCHAIN" test --locked --offline --manifest-path "$consumer/Cargo.toml" \
              --test transport_contract "$selector" -- --nocapture \
              | tee "$RUNNER_TEMP/sdk-upgrade-evidence/$selector.log" || result=1
          done
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target engine_control --test-filter folder_unregistration_workflow_ \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/unregistration-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target local_sync_engine --test-filter local_sync_business_native_ \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/local-sync-workflow-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target engine_control --test-filter folder_registration_workflow_ \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/registration-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target authentication_engine --test-filter gui_password_sessions_logout_and_api_key_management_are_independent \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/gui-auth-native" || result=1
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target devices --test-filter actual_receipt_disconnect_and_remove_preserves_files \
            --sdk-completion-consumer "$consumer" \
            --evidence-dir "$RUNNER_TEMP/sdk-upgrade-evidence/device-workflow-native" || result=1
          exit "$result"
      - name: Confirm final owned process cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          python scripts/prepare-test-engine.py check-cleanup \
            | tee "$RUNNER_TEMP/sdk-upgrade-evidence/final-target-cleanup.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sdk-upgrade-evidence-${{ matrix.package }}
          path: ${{ runner.temp }}/sdk-upgrade-evidence
          if-no-files-found: error
