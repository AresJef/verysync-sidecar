name: Old Linux SDK runtime

on:
  push:
    branches: [ci/linux-minimum-boot-20261119-01a1ca9b, ci/linux-i386-minimum-runtime-20261119-01a1ca9b, ci/linux-arm64-old-runtime-20261119-01a1ca9b, ci/linux-s390x-old-runtime-20261119-01a1ca9b]
    paths:
      - .github/workflows/linux-minimum-runtime.yml
      - scripts/prepare-linux-minimum-boot.py
      - scripts/linux-minimum-boot-i386-packages.json
      - scripts/linux-minimum-boot-arm64-packages.json
      - scripts/linux-minimum-boot-s390x-packages.json
      - scripts/probes/build-linux-minimum-runtime.sh
      - scripts/probes/linux_guest_entropy.c
      - scripts/probes/linux_minimum_runtime.rs

permissions:
  contents: read

jobs:
  runtime:
    if: >-
      github.repository == 'AresJef/verysync-sidecar' &&
      (github.ref_name == 'ci/linux-minimum-boot-20261119-01a1ca9b' ||
       github.ref_name == 'ci/linux-i386-minimum-runtime-20261119-01a1ca9b' ||
       github.ref_name == 'ci/linux-arm64-old-runtime-20261119-01a1ca9b' ||
       github.ref_name == 'ci/linux-s390x-old-runtime-20261119-01a1ca9b')
    name: Verify the fixed SDK and core on pinned offline Debian guests
    runs-on: ${{ github.ref_name == 'ci/linux-arm64-old-runtime-20261119-01a1ca9b' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.ref_name == 'ci/linux-s390x-old-runtime-20261119-01a1ca9b' && 40 || 22 }}
    env:
      GUEST_ARCH: >-
        ${{ github.ref_name == 'ci/linux-s390x-old-runtime-20261119-01a1ca9b' && 's390x' ||
        github.ref_name == 'ci/linux-arm64-old-runtime-20261119-01a1ca9b' && 'arm64' ||
        github.ref_name == 'ci/linux-i386-minimum-runtime-20261119-01a1ca9b' && 'i386' || 'amd64' }}
      EXACT_CANDIDATE: 83942f58532cbad796a1d89aaee1fe9e2b04df85
      EXACT_CANDIDATE_TREE: 054c09ee2d25e7b8bc8f90fdc758c30fe4c5fd04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXACT_CANDIDATE }}
          path: verified-product
          persist-credentials: false
      - name: Prepare the fixed s390x compiler emulator on the disposable runner
        if: env.GUEST_ARCH == 's390x'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
          platforms: s390x
      - name: Build the unchanged candidate under the fixed GNU libc and compiler
        run: |
          set -euo pipefail
          test "$(git -C verified-product rev-parse HEAD)" = "$EXACT_CANDIDATE"
          test "$(git -C verified-product rev-parse 'HEAD^{tree}')" = "$EXACT_CANDIDATE_TREE"
          test -z "$(git -C verified-product status --porcelain)"
          printf 'product source=%s tree=%s\n' "$EXACT_CANDIDATE" "$EXACT_CANDIDATE_TREE"
          work="$RUNNER_TEMP/vs-minimum-runtime"
          mkdir -m 0700 "$work"
          mkdir "$work/build" "$work/official-core" "$work/runs"
          archive_sha=
          case "$GUEST_ARCH" in
            amd64)
              test "$(uname -m)" = x86_64
              image=quay.io/pypa/manylinux2014_x86_64@sha256:e6a785657009c612fe2a85fa933051d03a50ba62b1c5e47d62abcab546a2e423
              platform=amd64
              target=x86_64-unknown-linux-gnu
              ;;
            i386)
              test "$(uname -m)" = x86_64
              image=quay.io/pypa/manylinux2014_i686@sha256:7ff084c274da66ed891df826b97cd5bb1b1d36db2cc86e4f052ce47cb4b69ead
              platform=386
              target=i686-unknown-linux-gnu
              archive_sha=6087c260a0c400283d55a4648d5a35983b17701c4b5cc1b5243f7ea11d5e0059
              ;;
            arm64)
              test "$(uname -m)" = aarch64
              image=quay.io/pypa/manylinux2014_aarch64@sha256:c2995cae5e2d433fbe757d1466486727b3edd68ba644cd60df253365f35fda9e
              platform=arm64
              target=aarch64-unknown-linux-gnu
              ;;
            s390x)
              test "$(uname -m)" = x86_64
              image=quay.io/pypa/manylinux2014_s390x@sha256:e301b7281918f7e2bbbda6d266f77e3df835ffe6f922008cf092bd9ab592c282
              platform=s390x
              target=s390x-unknown-linux-gnu
              archive_sha=2e896fee75d6794627d36a285f1bcc6a4a0623134597b281844d87b6fc0562c5
              ;;
            *) exit 2 ;;
          esac
          if [ -n "$archive_sha" ]; then
            archive="rust-1.85.0-$target"
            curl --proto '=https' --fail --silent --show-error --connect-timeout 10 --max-time 120 \
              --max-filesize 300000000 --output "$work/$archive.tar.xz" \
              "https://static.rust-lang.org/dist/2025-02-20/$archive.tar.xz"
            (cd "$work" && printf '%s  %s\n' "$archive_sha" "$archive.tar.xz" | sha256sum --check)
            tar -xJf "$work/$archive.tar.xz" -C "$work"
            sysroot="$work/toolchain"
            "$work/$archive/install.sh" --prefix="$sysroot" --disable-ldconfig
          else
            rustup toolchain install 1.85.0 --profile minimal --no-self-update
            sysroot="$(rustc +1.85.0 --print sysroot)"
          fi
          docker pull --platform "linux/$platform" "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$platform"
          docker image inspect --format '{{.Id}} {{.Architecture}} {{json .RepoDigests}}' "$image"
          docker run --rm --platform "linux/$platform" --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/verified-product,dst=/candidate,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/probes,dst=/support,readonly" \
            --mount "type=bind,src=$sysroot,dst=/toolchain,readonly" \
            --mount "type=bind,src=$work/build,dst=/evidence" \
            "$image" /bin/bash /support/build-linux-minimum-runtime.sh "$target"
      - name: Compare platform trust and verify native Rust effects on the pinned kernels
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vs-minimum-runtime"
          suites=(squeeze wheezy)
          vm_package=(qemu-system-x86 seabios)
          machine=pc
          serial=ttyS0
          kernel=bzImage
          case "$GUEST_ARCH" in
            amd64) qemu=qemu-system-x86_64; cpu=qemu64; package=linux-amd64-standard ;;
            i386) qemu=qemu-system-i386; cpu=qemu32,+pae; package=linux-386-standard ;;
            arm64)
              suites=(jessie)
              vm_package=(qemu-system-arm)
              machine=virt
              serial=ttyAMA0
              kernel=Image
              qemu=qemu-system-aarch64
              cpu=cortex-a57
              package=linux-arm64-standard
              ;;
            s390x)
              suites=(wheezy)
              vm_package=(qemu-system-misc qemu-system-data)
              machine=s390-ccw-virtio
              serial=ttyS1
              kernel=image
              qemu=qemu-system-s390x
              cpu=max
              package=linux-s390x-standard
              ;;
            *) exit 2 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${vm_package[@]}"
          "$qemu" --version
          python3 -B verified-product/scripts/prepare-test-engine.py prepare \
            --package "$package" --parent "$work/official-core" > "$work/native-program-receipt.json"
          overall=0
          for suite in "${suites[@]}"; do
            root="$work/runs/$suite"
            if ! python3 -B scripts/prepare-linux-minimum-boot.py "$suite" --architecture "$GUEST_ARCH" --destination "$root" \
              --runtime-dir "$work/build/guest-runtime" --engine-receipt "$work/native-program-receipt.json"; then
              overall=1
              continue
            fi
            release=$(python3 -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["expected_uname_release"])' "$root/prepared-boot-fixture.json")
            for trust in absent debian; do
              log="$root/guest-console-$trust.log"
              console="$root/guest-console-$trust.txt"
              status=0
              timeout 170s "$qemu" -machine "$machine,accel=tcg" -cpu "$cpu" -m 512 -smp 1 \
                -nodefaults -display none -serial stdio -monitor none -nic none -no-reboot \
                -kernel "$root/$suite/$kernel" -initrd "$root/$suite/initramfs.cpio.gz" \
                -append "console=$serial rdinit=/init vs_minimum_entropy=seeded vs_minimum_certs=$trust panic=1" > "$log" 2>&1 || status=$?
              tr -d '\r' < "$log" > "$console"
              cat "$console"
              echo "Guest $suite trust=$trust emulator_exit=$status"
              if [ "$status" -ne 0 ] \
                || ! grep -Fxq "VS_MINIMUM_BOOT_OK kernel=$release loopback=127.0.0.1" "$console" \
                || ! grep -Fxq 'VS_MINIMUM_CORE_VERSION_OK v2.33.2' "$console" \
                || ! grep -Fxq 'VS_MINIMUM_GLIBC_VERSION glibc=2.17' "$console" \
                || ! grep -Fxq 'VS_MINIMUM_PTY_READY devpts=true ptmx=true' "$console" \
                || ! grep -Fxq 'VS_MINIMUM_ENTROPY_MODE seeded' "$console" \
                || ! grep -Fxq 'VS_MINIMUM_ENTROPY_CREDIT_OK bits=512' "$console" \
                || ! grep -Eq '^VS_MINIMUM_ENTROPY phase=before_sdk bits=[0-9]+ readable=1$' "$console" \
                || ! grep -Eq '^VS_MINIMUM_ENTROPY phase=after_sdk bits=[0-9]+ readable=[01]$' "$console" \
                || ! grep -Fxq "VS_MINIMUM_CA_MODE $trust" "$console" \
                || ! grep -Fxq 'VS_MINIMUM_SDK_RUNTIME uid=1000 loaded_fixture_libc=true' "$console" \
                || grep -q 'Kernel panic - not syncing' "$console"; then
                overall=1
                continue
              fi
              if [ "$trust" = debian ] &&
                 grep -Fxq 'VS_MINIMUM_CA_BUILDER debian_ca=true builder_ok=true missing_platform_roots=false' "$console" &&
                 grep -Eq '^VS_MINIMUM_SDK_OK \{' "$console" &&
                 ! grep -q '^VS_MINIMUM_BOOT_FAILURE ' "$console"; then
                echo "Guest $suite trust=$trust sdk_result=passed"
              elif [ "$trust" = absent ] &&
                   grep -Fxq 'VS_MINIMUM_CA_BUILDER debian_ca=false builder_ok=false missing_platform_roots=true' "$console" &&
                   grep -Eq '^VS_MINIMUM_SDK_START_OBSERVATION .*"native_health_http_status":200[,}]' "$console" &&
                   grep -Fxq 'VS_MINIMUM_SDK_FAILURE_CLEANUP exact_exit_and_lease_release=true' "$console" &&
                   grep -Fxq 'VS_MINIMUM_BOOT_FAILURE sdk_runtime' "$console" &&
                   grep -Fxq 'Error: Error(management deadline exceeded while attempting to start managed instance)' "$console"; then
                echo "Guest $suite trust=$trust sdk_result=missing_platform_ca_control"
              else
                overall=1
              fi
            done
          done
          exit "$overall"
      - name: Retain original consoles and source checksums
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-minimum-runtime-evidence
          path: |
            ${{ runner.temp }}/vs-minimum-runtime/runs/*/guest-console-*.log
            ${{ runner.temp }}/vs-minimum-runtime/runs/*/prepared-boot-fixture.json
            ${{ runner.temp }}/vs-minimum-runtime/build/*sha256.txt
            ${{ runner.temp }}/vs-minimum-runtime/build/linked-libraries.txt
            ${{ runner.temp }}/vs-minimum-runtime/build/symbol-versions.txt
            ${{ runner.temp }}/vs-minimum-runtime/native-program-receipt.json
          if-no-files-found: warn
