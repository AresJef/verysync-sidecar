name: Darwin process read diagnosis

on:
  pull_request:
    paths:
      - .github/diagnostics/darwin-process-read/**
      - .github/workflows/macos-process-read-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darwin-process-read-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel:
    name: Compare equivalent owned reads on native Mac Intel
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the fixed existing resource observer dependency
        run: python -m pip install -r scripts/resource-test-requirements.txt
      - name: Verify equivalent CPU RSS birth and refusal behavior, then report diagnostic cost
        run: >-
          python -B .github/diagnostics/darwin-process-read/compare-owned-metrics.py
          --sampler "$GITHUB_WORKSPACE/scripts/measure-native-resources.py"
          --result "$RUNNER_TEMP/darwin-owned-process-read.json" --expected-architecture x86_64
