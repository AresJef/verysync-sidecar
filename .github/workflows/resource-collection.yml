name: Frozen resource collection

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
    paths:
      - src/**
      - .gitattributes
      - Cargo.toml
      - Cargo.lock
      - tests/resource_usage_engine.rs
      - tests/common/resource_fixture.rs
      - tests/common/resource_faults.rs
      - tests/common/managed_fixture.rs
      - tests/fixtures/resource-protocol.json
      - scripts/measure-native-resources.py
      - scripts/darwin-owned-sample.c
      - scripts/darwin_owned_reader.py
      - scripts/macos-observer-activity.py
      - scripts/tests/test_macos_observer_activity.py
      - scripts/collect-native-resources.py
      - scripts/plan-resource-collection.py
      - scripts/preflight-native-resources.py
      - scripts/check-native-resource-profile.py
      - scripts/run-isolated-engine-tests.py
      - scripts/resource-test-requirements.txt
      - scripts/tests/test_resource_*.py
      - .github/workflows/resource-collection.yml
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: frozen-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: (github.event_name != 'push' || (github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted)) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'resource-formal') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.head_ref != 'ci/arm-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.head_ref != 'ci/intel-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.head_ref != 'ci/intel-v27-preparation-window-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'test/native-introduction-encryption-20261118-01a1ca9b' || contains(github.event.pull_request.labels.*.name, 'resource-formal'))
    name: Plan frozen resource profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.selection.outputs.profiles }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select the frozen resource profiles
        id: selection
        run: python3 scripts/plan-resource-collection.py
      - name: Record the R23 Intel formal resource deferral
        if: steps.selection.outputs.deferred_profile == 'macos-amd64-standard'
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          macOS Intel formal resource collection and independent reruns are deferred for this candidate.
          The prior Intel preparations produced zero qualifying formal samples.
          See the first stable release scope in docs/public/release-checklist.md.
          EOF

  collect:
    needs: plan
    if: needs.plan.result == 'success'
    name: Resource coverage (${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    # Allow cold preparation, the full frozen acquisition window, and evidence saving.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.profiles) }}
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install fixed explicit measurement dependency and native MSRV
        run: |
          python -m pip install -r scripts/resource-test-requirements.txt
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Verify frozen preparation inputs before preparing the engine
        run: >-
          python scripts/preflight-native-resources.py --check-source
          --protocol tests/fixtures/resource-protocol.json --toolchain "$TEST_TOOLCHAIN"
          --cargo "$(python -c 'import shutil; print(shutil.which("cargo"))')"
      - name: Verify measurement quality and complete-group contracts
        run: |
          python -m unittest discover -s scripts/tests -p 'test_resource_*.py'
          python -m unittest discover -s scripts/tests -p 'test_macos_timer_probe.py'
          python -m unittest discover -s scripts/tests -p 'test_macos_observer_activity.py'
          python -m unittest discover -s scripts/tests -p 'test_native_observer_diagnosis.py'
      - name: Build the frozen Darwin snapshot helper
        if: runner.os == 'macOS'
        run: |
          library="$RUNNER_TEMP/verysync-darwin-owned-sample.dylib"
          xcrun clang -O2 -Wall -Wextra -Werror -dynamiclib scripts/darwin-owned-sample.c -o "$library"
          printf 'VERYSYNC_DARWIN_METRICS_LIBRARY=%s\n' "$library" >> "$GITHUB_ENV"
      - name: Explicitly prepare this profile's fixed private core
        run: >-
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Retain actual counter resolution and balanced timer wakeup calibration
        run: >-
          python scripts/measure-native-resources.py --stage calibration --timer-calibration
          --evidence-dir "${{ runner.temp }}/vs-resource-clock-calibration"
      - name: Build the exact release workload before acquisition
        run: cargo +"$TEST_TOOLCHAIN" test --release --no-run --features engine-tests,download --test resource_usage_engine --locked
      - name: Require complete fresh-process preparation on this actual profile
        run: >-
          python scripts/preflight-native-resources.py
          --protocol tests/fixtures/resource-protocol.json --toolchain "$TEST_TOOLCHAIN"
          --cargo "$(python -c 'import shutil; print(shutil.which("cargo"))')"
          --evidence-dir "${{ runner.temp }}/vs-resource-v25-pretrial"
      - name: Collect four formal and two independent original-order cycles
        id: collection
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'resource-formal')
        run: >-
          python scripts/collect-native-resources.py --stage all
          --protocol tests/fixtures/resource-protocol.json --toolchain "$TEST_TOOLCHAIN"
          --cargo "$(python -c 'import shutil; print(shutil.which("cargo"))')"
          --evidence-dir "${{ runner.temp }}/vs-frozen-resource-v25"
      - name: Require frozen resource limits and exact candidate identity
        if: steps.collection.outcome == 'success'
        run: >-
          python scripts/check-native-resource-profile.py --profile "${{ matrix.package }}"
          --protocol tests/fixtures/resource-protocol.json
          --collection "${{ runner.temp }}/vs-frozen-resource-v25"
          --preparation "${{ runner.temp }}/vs-resource-v25-pretrial"
          --output "${{ runner.temp }}/vs-resource-verdict"
          --source "$(git rev-parse HEAD)" --tree "$(git rev-parse 'HEAD^{tree}')"
          --engine-sha256 "$VERYSYNC_TEST_BINARY_SHA256"
      - name: Require exact owned-program cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Preserve sanitized raw measurements and immutable group records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frozen-resources-${{ matrix.package }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/vs-resource-verdict/resource-report.json
            ${{ runner.temp }}/vs-resource-verdict/resource-report.md
            ${{ runner.temp }}/vs-frozen-resource-v25/**/collection-state.json
            ${{ runner.temp }}/vs-frozen-resource-v25/**/frozen-protocol.json
            ${{ runner.temp }}/vs-frozen-resource-v25/**/accepted-group.json
            ${{ runner.temp }}/vs-frozen-resource-v25/**/attempt.json
            ${{ runner.temp }}/vs-frozen-resource-v25/**/preparation-result.json
            ${{ runner.temp }}/vs-frozen-resource-v25/**/quality-result.json
            ${{ runner.temp }}/vs-frozen-resource-v25/**/samples.jsonl
            ${{ runner.temp }}/vs-frozen-resource-v25/**/events.jsonl
            ${{ runner.temp }}/vs-frozen-resource-v25/**/safe-error.json
            ${{ runner.temp }}/vs-frozen-resource-v25/**/console.log
            ${{ runner.temp }}/vs-frozen-resource-v25/**/*.console.log
            ${{ runner.temp }}/vs-resource-clock-calibration/calibration.json
            ${{ runner.temp }}/vs-resource-clock-calibration/safe-error.json
            ${{ runner.temp }}/vs-resource-v25-pretrial/**/preparation-result.json
            ${{ runner.temp }}/vs-resource-v25-pretrial/**/quality-result.json
            ${{ runner.temp }}/vs-resource-v25-pretrial/**/samples.jsonl
            ${{ runner.temp }}/vs-resource-v25-pretrial/**/events.jsonl
            ${{ runner.temp }}/vs-resource-v25-pretrial/**/safe-error.json
            ${{ runner.temp }}/vs-resource-v25-pretrial/**/console.log
            ${{ runner.temp }}/vs-resource-v25-pretrial/pretrial-result.json
