name: Frozen resource collection

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - src/**
      - .gitattributes
      - Cargo.toml
      - Cargo.lock
      - tests/resource_usage_engine.rs
      - tests/common/resource_fixture.rs
      - tests/common/resource_faults.rs
      - tests/common/managed_fixture.rs
      - tests/fixtures/resource-protocol.json
      - scripts/measure-native-resources.py
      - scripts/collect-native-resources.py
      - scripts/preflight-native-resources.py
      - scripts/run-isolated-engine-tests.py
      - scripts/resource-test-requirements.txt
      - scripts/tests/test_resource_*.py
      - .github/workflows/resource-collection.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Resource coverage (${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-amd64-standard
            runner: macos-15-intel
            rust: x86_64-apple-darwin
          - package: macos-arm64-standard
            runner: macos-15
            rust: aarch64-apple-darwin
          - package: linux-amd64-standard
            runner: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
          - package: linux-arm64-standard
            runner: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
          - package: windows-amd64-standard
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
          - package: windows-arm64-standard
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install fixed explicit measurement dependency and native MSRV
        run: |
          python -m pip install -r scripts/resource-test-requirements.txt
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Verify measurement quality and complete-group contracts
        run: python -m unittest discover -s scripts/tests -p 'test_resource_*.py'
      - name: Explicitly prepare this profile's fixed private core
        run: >-
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Retain actual counter resolution and balanced timer wakeup calibration
        run: >-
          python scripts/measure-native-resources.py --stage calibration --timer-calibration
          --evidence-dir "${{ runner.temp }}/vs-resource-clock-calibration"
      - name: Build the exact release workload before acquisition
        run: cargo +"$TEST_TOOLCHAIN" test --release --no-run --features engine-tests,download --test resource_usage_engine --locked
      - name: Require complete fresh-process preparation on this actual profile
        run: >-
          python scripts/preflight-native-resources.py
          --protocol tests/fixtures/resource-protocol.json --toolchain "$TEST_TOOLCHAIN"
          --cargo "$(python -c 'import shutil; print(shutil.which("cargo"))')"
          --evidence-dir "${{ runner.temp }}/vs-resource-v12-pretrial"
      - name: Collect four formal and two independent original-order cycles
        if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
        run: >-
          python scripts/collect-native-resources.py --stage all
          --protocol tests/fixtures/resource-protocol.json --toolchain "$TEST_TOOLCHAIN"
          --cargo "$(python -c 'import shutil; print(shutil.which("cargo"))')"
          --evidence-dir "${{ runner.temp }}/vs-frozen-resource-v12"
      - name: Require exact owned-program cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Preserve sanitized raw measurements and immutable group records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frozen-resources-${{ matrix.package }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/vs-frozen-resource-v12/**/collection-state.json
            ${{ runner.temp }}/vs-frozen-resource-v12/**/frozen-protocol.json
            ${{ runner.temp }}/vs-frozen-resource-v12/**/accepted-group.json
            ${{ runner.temp }}/vs-frozen-resource-v12/**/attempt.json
            ${{ runner.temp }}/vs-frozen-resource-v12/**/preparation-result.json
            ${{ runner.temp }}/vs-frozen-resource-v12/**/quality-result.json
            ${{ runner.temp }}/vs-frozen-resource-v12/**/samples.jsonl
            ${{ runner.temp }}/vs-frozen-resource-v12/**/events.jsonl
            ${{ runner.temp }}/vs-frozen-resource-v12/**/safe-error.json
            ${{ runner.temp }}/vs-resource-clock-calibration/calibration.json
            ${{ runner.temp }}/vs-resource-clock-calibration/safe-error.json
            ${{ runner.temp }}/vs-resource-v12-pretrial/**/preparation-result.json
            ${{ runner.temp }}/vs-resource-v12-pretrial/**/quality-result.json
            ${{ runner.temp }}/vs-resource-v12-pretrial/**/samples.jsonl
            ${{ runner.temp }}/vs-resource-v12-pretrial/**/events.jsonl
            ${{ runner.temp }}/vs-resource-v12-pretrial/**/safe-error.json
            ${{ runner.temp }}/vs-resource-v12-pretrial/pretrial-result.json
