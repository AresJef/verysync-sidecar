name: Route probe for frozen resources
on:
  push:
    branches: ['ci/formal-candidate/**']

permissions:
  contents: read

jobs:
  probe:
    if: (github.event_name != 'push' || (github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted)) && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'resource-formal') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.head_ref != 'ci/arm-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.head_ref != 'ci/intel-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.head_ref != 'ci/intel-v27-preparation-window-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'test/native-introduction-encryption-20261118-01a1ca9b' || contains(github.event.pull_request.labels.*.name, 'resource-formal'))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      EXACT_SOURCE: 0cb2613797f3d3e327996e0bf034ec72b9dab0e2
      EXACT_TREE: 30dac6ec75db9d3df745f4c370c95c14d6b52ec5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '0cb2613797f3d3e327996e0bf034ec72b9dab0e2'
          persist-credentials: false
      - name: Bind this probe to the exact staged candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ci/formal-candidate/routing-check-20261119-01a1ca9b'
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXACT_TREE"
          test -z "$(git status --porcelain)"
          printf 'Exact route probe source=%s tree=%s\n' "$EXACT_SOURCE" "$EXACT_TREE"
      - name: Confirm the formal-collection step is selected by the actual push
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'resource-formal')
        run: |
          set -euo pipefail
          printf 'Real first-party push selected the formal resource step condition.\n'
          printf 'This routing probe collected no resource samples.\n'
