name: Verify actual file transfer and recovery through the private native relay
on:
  push:
    branches: [verify/r24/native-relay-file-recovery]
permissions:
  contents: read
jobs:
  ordinary:
    name: Packaged private relay file recovery (${{ matrix.package }})
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: linux-arm64-standard
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu
          - package: macos-arm64-standard
            runner: macos-15
            rust_host: aarch64-apple-darwin
    env:
      TEST_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          path: candidate
          ref: 4f14f1b62db836b25a3e5beb4cf5e68314ddea85
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build and verify the exact candidate crate
        working-directory: candidate
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/relay-candidate-target"
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          test "$(rustc +"$TEST_TOOLCHAIN" -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          cargo +"$TEST_TOOLCHAIN" package --offline --locked
          RUSTUP_TOOLCHAIN="$TEST_TOOLCHAIN" python3 -B scripts/publish-github-release.py \
            --metadata ../.github/diagnostics/relay-file-candidate.json \
            --check-package "$CARGO_TARGET_DIR/package/verysync-sidecar-0.1.0-alpha.2.crate"
      - name: Prepare matching pinned native fixture with private state
        working-directory: candidate
        run: >-
          python3 scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Require file digests, relay path, pause recovery and native cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/relay-crate"
          tar -xzf "$CARGO_TARGET_DIR/package/verysync-sidecar-0.1.0-alpha.2.crate" -C "$RUNNER_TEMP/relay-crate"
          cd "$RUNNER_TEMP/relay-crate/verysync-sidecar-0.1.0-alpha.2"
          evidence="$RUNNER_TEMP/native-relay-file-effects"
          python3 scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target network --test-filter actual_owned_private_relay_session_with_tcp_and_udp_disabled \
            --evidence-dir "$evidence"
          grep -E '^test result: ok. 1 passed; 0 failed; 0 ignored;' "$evidence/network.log"
          grep -F 'public private relay file evidence: ' "$evidence/network.log"
      - name: Require final exact owned-executable cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        working-directory: candidate
        run: python3 scripts/prepare-test-engine.py check-cleanup
