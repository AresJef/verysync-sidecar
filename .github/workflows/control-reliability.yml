name: Control reliability

on:
  push:
    branches:
      - 'ci/control-reliability-*'
      - 'ci/formal-candidate/control-reliability-*'
      - 'ci/formal-candidate/upgrade-receipts-*'
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitattributes'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/control-reliability.yml'
      - 'src/control_operation.rs'
      - 'src/control_observation.rs'
      - 'src/capabilities.rs'
      - 'src/client/control_*.rs'
      - 'src/client/gui_listener.rs'
      - 'src/client/device*.rs'
      - 'src/managed/control_generation.rs'
      - 'src/managed/observation.rs'
      - 'examples/gui_listener_recovery.rs'
      - 'examples/*_control.rs'
      - 'docs/public/control-*.md'
      - 'tests/control_*.rs'
      - 'tests/common/control_*.rs'
      - 'scripts/check-control-candidate-compatibility.py'
      - 'scripts/check-control-corrections-*.py'
      - 'scripts/prepare-control-reliability-consumer.py'

permissions:
  contents: read

concurrency:
  group: control-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Freeze one exact candidate archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare pinned Cargo and locked dependencies
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 fetch --locked
      - name: Build and record the checkout's exact crate
        run: >-
          python scripts/prepare-control-reliability-consumer.py --toolchain 1.85.0
          --package-only --work "$RUNNER_TEMP/control-package-work"
          --evidence "$RUNNER_TEMP/control-frozen-package"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: control-frozen-package
          path: ${{ runner.temp }}/control-frozen-package
          if-no-files-found: error

  consumers:
    name: Packaged consumers and published API compatibility
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
        with:
          name: control-frozen-package
          path: ${{ runner.temp }}/control-frozen-package
      - name: Prepare the supported SDK compiler and fixed API checker
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.85.0 fetch --locked
          python scripts/prepare-api-compatibility-tool.py --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Compare the exact candidate and published crate in three feature profiles
        run: |
          curl --fail --silent --show-error --location --max-time 40 \
            https://static.crates.io/crates/verysync-sidecar/verysync-sidecar-0.1.1.crate \
            --output "$RUNNER_TEMP/published-0.1.1.crate"
          python scripts/check-control-candidate-compatibility.py \
            --candidate "$RUNNER_TEMP/control-frozen-package/candidate.crate" \
            --identity "$RUNNER_TEMP/control-frozen-package/package.json" \
            --baseline "$RUNNER_TEMP/published-0.1.1.crate" --checker "$VERYSYNC_SEMVER_CHECKER" \
            --cargo "$(command -v cargo)" --parent "$RUNNER_TEMP" --evidence "$RUNNER_TEMP/profile-evidence/api"
      - name: Verify the exact development baseline API for upgrade receipts
        if: startsWith(github.ref, 'refs/heads/ci/formal-candidate/upgrade-receipts-')
        run: |
          git fetch --no-tags --depth=1 https://github.com/AresJef/verysync-sidecar.git \
            1c1f4956aa850b9ff662e07de910c49e0c9320a1
          git worktree add --detach "$RUNNER_TEMP/upgrade-prior" 1c1f4956aa850b9ff662e07de910c49e0c9320a1
          trap 'git worktree remove "$RUNNER_TEMP/upgrade-prior"' EXIT
          (
            cd "$RUNNER_TEMP/upgrade-prior"
            cargo +1.85.0 package --locked --offline --no-verify --target-dir "$RUNNER_TEMP/upgrade-prior-target"
          )
          python scripts/check-control-candidate-compatibility.py \
            --candidate "$RUNNER_TEMP/control-frozen-package/candidate.crate" \
            --identity "$RUNNER_TEMP/control-frozen-package/package.json" \
            --baseline "$RUNNER_TEMP/upgrade-prior-target/package/verysync-sidecar-0.1.2.crate" \
            --baseline-identity 0.1.2-development \
            --checker "$VERYSYNC_SEMVER_CHECKER" --cargo "$(command -v cargo)" \
            --parent "$RUNNER_TEMP" --evidence "$RUNNER_TEMP/profile-evidence/0.1.2-api"
      - name: Build and run an external consumer under each feature profile
        run: |
          set -o pipefail
          for profile in minimal default all; do
            base="$RUNNER_TEMP/profile-evidence/$profile"
            settings="$RUNNER_TEMP/control-$profile.env"
            python scripts/prepare-control-reliability-consumer.py --toolchain 1.85.0 \
              --candidate "$RUNNER_TEMP/control-frozen-package/candidate.crate" \
              --candidate-identity "$RUNNER_TEMP/control-frozen-package/package.json" \
              --work "$RUNNER_TEMP/control-$profile" --evidence "$base" --github-env "$settings" --profile "$profile"
            set -a
            source "$settings"
            set +a
            for program in "$VERYSYNC_TEST_RECOVERY_EXAMPLE" "$VERYSYNC_TEST_OBSERVATION_EXAMPLE" "$VERYSYNC_TEST_PREVIEW_EXAMPLE" "$VERYSYNC_TEST_PREFLIGHT_EXAMPLE" "$VERYSYNC_TEST_MANAGED_EXAMPLE"; do
              "$program" --help | tee "$base/$(basename "$program").help"
            done
            cargo +1.85.0 test --locked --offline --features engine-tests --test control_reliability_engine \
              package_consumer_distinguishes_acknowledgement_loss_and_later_changes -- --nocapture \
              | tee "$base/control-recovery.log"
            cargo +1.85.0 test --locked --offline --test control_preview_contract \
              package_consumer_requires_approval_before_one_scoped_write -- --nocapture \
              | tee "$base/control-preview.log"
            python scripts/check-control-corrections-output.py \
              --listener "$VERYSYNC_TEST_RECOVERY_EXAMPLE" --preview "$VERYSYNC_TEST_PREVIEW_EXAMPLE" \
              | tee "$base/control-corrections-output.jsonl"
          done
      - name: Archive exact consumer and comparison receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: control-consumer-feature-profiles
          path: ${{ runner.temp }}/profile-evidence

  native:
    name: Listener recovery (${{ matrix.package }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: macos-amd64-standard, runner: macos-15-intel, rust: x86_64-apple-darwin, observe: '1'}
          - {package: macos-arm64-standard, runner: macos-15, rust: aarch64-apple-darwin, observe: '1'}
          - {package: windows-amd64-standard, runner: windows-2022, rust: x86_64-pc-windows-msvc, observe: '0'}
          - {package: windows-arm64-standard, runner: windows-11-arm, rust: aarch64-pc-windows-msvc, observe: '0'}
          - {package: linux-amd64-standard, runner: ubuntu-24.04, rust: x86_64-unknown-linux-gnu, observe: '1'}
          - {package: linux-arm64-standard, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, observe: '1'}
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
      VERYSYNC_TEST_REQUIRE_DIRECT_REQUEST_CAPTURE: ${{ matrix.observe }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install and identify the native Rust toolchain
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Select separate x64 TLS-peer tooling on Windows ARM
        if: matrix.package == 'windows-arm64-standard'
        id: peer_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          update-environment: false
      - name: Prepare the private protocol-peer runtime
        env:
          VERYSYNC_STORAGE_BASE_PYTHON: ${{ steps.peer_python.outputs.python-path }}
        run: python scripts/prepare-storage-test-environment.py --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Prepare the matching official VerySync v2.33.2 test program
        run: |
          mkdir -p "${{ runner.temp }}/control-evidence"
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}" --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV" | tee "${{ runner.temp }}/control-evidence/engine.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
        with:
          name: control-frozen-package
          path: ${{ runner.temp }}/control-frozen-package
      - name: Verify and consume the same candidate archive on this native host
        run: >-
          python scripts/prepare-control-reliability-consumer.py --toolchain "$TEST_TOOLCHAIN"
          --candidate "${{ runner.temp }}/control-frozen-package/candidate.crate"
          --candidate-identity "${{ runner.temp }}/control-frozen-package/package.json"
          --work "${{ runner.temp }}/control-package-consumer"
          --evidence "${{ runner.temp }}/control-evidence/consumer" --github-env "$GITHUB_ENV"
      - name: Check the packaged command output and exact recovery requests
        run: |
          set -o pipefail
          python scripts/check-control-corrections-output.py \
            --listener "$VERYSYNC_TEST_RECOVERY_EXAMPLE" --preview "$VERYSYNC_TEST_PREVIEW_EXAMPLE" \
            | tee "${{ runner.temp }}/control-evidence/control-corrections-output.jsonl"
      - name: Check cancelled storage workers and reopen the final receipt
        run: >-
          python scripts/check-control-corrections-storage.py --toolchain "$TEST_TOOLCHAIN"
          --consumer-work "${{ runner.temp }}/control-package-consumer"
          --consumer-build "${{ runner.temp }}/control-evidence/consumer/build.json"
          --crate "${{ runner.temp }}/control-frozen-package/candidate.crate"
          --output "${{ runner.temp }}/control-evidence/control-corrections-storage"
      - name: Require the controlled request counters and receipt contracts
        run: |
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --test control_fault_fixture -- --nocapture
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --test transport_contract control_receipt_contracts -- --nocapture
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --test transport_contract control_device_receipt_contracts -- --nocapture
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --test control_observation_contract --test control_preview_contract --test control_preflight_contract -- --nocapture
      - name: Verify native control, package consumers and exact write counts
        run: |
          result=0
          for target in control_reliability_engine control_observation_engine control_preview_engine control_preflight_engine; do
            python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
              --test-target "$target" --evidence-dir "${{ runner.temp }}/control-evidence/$target" || result=1
          done
          exit "$result"
      - name: Observe a native peer disconnect before a single removal
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target devices --test-filter actual_receipt_disconnect_and_remove_preserves_files
          --evidence-dir "${{ runner.temp }}/control-evidence/staged-device-removal"
      - name: Confirm no exact task-owned test core remains
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup | tee "${{ runner.temp }}/control-evidence/core-cleanup.log"
      - name: Archive the candidate consumer and native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: control-reliability-${{ matrix.package }}
          path: ${{ runner.temp }}/control-evidence
