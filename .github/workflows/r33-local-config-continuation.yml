name: R33 Local-API configuration continuation

on:
  push:
    branches: [ci/r33-synthetic-20261124]
    paths:
      - .github/workflows/r33-local-config-continuation.yml
      - tests/r33-local-config-continuation/**

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select the fixed Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Build the driver and verify the signed-out native scope
        run: >-
          /usr/bin/python3 -B tests/r33-local-config-continuation/check-linux-configuration.py
          --source tests/r33-local-config-continuation/driver
          --evidence "${{ runner.temp }}/r33-local-config-continuation"
      - name: Preserve the tested driver and signed-out receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: r33-local-config-continuation
          path: "${{ runner.temp }}/r33-local-config-continuation"
          if-no-files-found: error
          retention-days: 7
