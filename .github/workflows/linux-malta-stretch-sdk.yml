name: Exercise the fixed Rust SDK with both offline Debian Stretch Malta guests

on:
  push:
    branches: [ci/linux-malta-stretch-sdk-20261119-01a1ca9b]
    paths:
      - .github/workflows/linux-malta-stretch-sdk.yml
      - scripts/linux-minimum-boot-mips-packages.json
      - scripts/linux-minimum-boot-mipsel-packages.json
      - scripts/prepare-linux-minimum-boot.py
      - scripts/probes/build-linux-armel-stretch-runtime.sh
      - scripts/probes/linux_minimum_runtime.rs
      - scripts/probes/linux_guest_entropy.c

permissions:
  contents: read

jobs:
  malta-runtime:
    if: github.repository == 'AresJef/verysync-sidecar' && github.ref == 'refs/heads/ci/linux-malta-stretch-sdk-20261119-01a1ca9b'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mips
            abi: mips-linux-gnu
            package: linux-mips-standard
            archive: 16ee91434add7aaafe4aa201d2c547d7f4af8abf804056e06b00d2b80c883ee3
            binary: 8549baa17ce60d57fa721713da6a858aa4543bb5fb0ae46d7a25b84c736de076
            kernel: 6b61c115a515c1007379a55bf944be9a54ea08e64de4d64fd3fa546121160dcf
          - profile: mipsel
            abi: mipsel-linux-gnu
            package: linux-mipsle-standard
            archive: 7b2e51ec5b017350dd37497a8203f1effc2e98059ccec104944dfbe82a9c6536
            binary: ac6b4491a11d7486edc3d6c5c40bc33fc85268d879290ef14bb8b17564422d58
            kernel: 20f5380e02f2e40d4495fd61a854e5867f5ccdf95c8c1fd3d53fe27e8be1797f
    env:
      PRODUCT_SOURCE: c661d51e0576603543da273913a5919e62df000b
      PRODUCT_TREE: fe22191751451e950a4fa1932f06d129c817341e
      PROFILE: ${{ matrix.profile }}
      GNU_ABI: ${{ matrix.abi }}
      PROGRAM_PACKAGE: ${{ matrix.package }}
      PROGRAM_ARCHIVE: ${{ matrix.archive }}
      PROGRAM_SHA: ${{ matrix.binary }}
      KERNEL_SHA: ${{ matrix.kernel }}
      QEMU_PROGRAM: qemu-system-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PRODUCT_SOURCE }}
          path: verified-product
          persist-credentials: false
      - name: Verify the product, archives and cross compiler
        run: |
          set -euo pipefail
          test "$(git -C verified-product rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$(git -C verified-product rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git -C verified-product status --porcelain)"
          printf 'product source=%s tree=%s\n' "$PRODUCT_SOURCE" "$PRODUCT_TREE"
          work="$RUNNER_TEMP/vs-malta-stretch-sdk"
          mkdir -pm 0700 "$work/packages" "$work/official-core" "$work/runs"
          python3 - "$work" <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(sys.argv[1])
          profile = os.environ["PROFILE"]
          assert profile in {"mips", "mipsel"}
          manifest = json.loads(Path(f"scripts/linux-minimum-boot-{profile}-packages.json").read_text())
          wanted = [("stretch", record) for record in manifest["stretch"]]
          wanted += [("buster", record) for record in manifest["buster-sysroot"]]
          def fetch(item):
              suite, record = item
              size = int(record["size"])
              path = root / "packages" / (suite + "-" + record["package"] + ".deb")
              subprocess.run(["curl", "--proto", "=https", "--silent", "--show-error", "--fail",
                              "--retry", "2", "--connect-timeout", "10", "--max-time", "45",
                              "--max-filesize", str(size), "--output", str(path),
                              "https://archive.debian.org/debian/" + record["filename"]], check=True)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert (path.stat().st_size, digest) == (size, record["sha256"])
              print(path.name, size, digest, flush=True)
          with ThreadPoolExecutor(max_workers=3) as executor:
              list(executor.map(fetch, wanted))
          PY
          python3 -B verified-product/scripts/prepare-test-engine.py prepare \
            --package "$PROGRAM_PACKAGE" --parent "$work/official-core" > "$work/official-core-receipt.json"
          python3 - "$work" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          report = json.loads((Path(sys.argv[1])/"official-core-receipt.json").read_text())
          assert (report["package"], report["version"]) == (os.environ["PROGRAM_PACKAGE"], "v2.33.2")
          assert (report["archive_sha256"], report["binary_sha256"]) == (os.environ["PROGRAM_ARCHIVE"], os.environ["PROGRAM_SHA"])
          print("Matched official MIPS archive and actual executable hashes", report["binary_sha256"])
          PY
          sources="$work/ubuntu-official-sources.list"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-security main universe' > "$sources"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=/dev/null
            -o Acquire::Retries=1 -o Acquire::https::Timeout=25)
          timeout --kill-after=10s 120s sudo apt-get "${apt_options[@]}" update
          timeout --kill-after=10s 230s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            "gcc-$GNU_ABI" "binutils-$GNU_ABI" qemu-system-mips qemu-system-data
          dpkg-query -W "gcc-$GNU_ABI" "binutils-$GNU_ABI" qemu-system-mips
          timeout --kill-after=5s 100s rustup toolchain install 1.85.0 --profile minimal --component rust-src
      - name: Link the unchanged Rust SDK and probe against the exact archived O32 Debian libc 2.28
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vs-malta-stretch-sdk"
          bash scripts/probes/build-linux-armel-stretch-runtime.sh "$PWD/verified-product" "$PWD/scripts/probes" "$work" "$PROFILE"
      - name: Exercise the original Rust data and cleanup gate with both CA states
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vs-malta-stretch-sdk"
          "$QEMU_PROGRAM" --version
          python3 -B scripts/prepare-linux-minimum-boot.py stretch --architecture "$PROFILE" \
            --destination "$work/boot" --local-package-dir "$work/packages" \
            --runtime-dir "$work/guest-runtime" --engine-receipt "$work/official-core-receipt.json"
          root="$work/boot/stretch"
          printf '%s  %s\n' "$KERNEL_SHA" "$root/vmlinux" | sha256sum --check --strict
          overall=0
          for trust in absent debian; do
            raw="$work/runs/guest-console-$trust.log"
            console="$work/runs/guest-console-$trust.txt"
            status=0
            timeout --kill-after=8s 170s "$QEMU_PROGRAM" -machine malta,accel=tcg -cpu 24Kf -m 256 -smp 1 \
              -nodefaults -display none -audio none -serial stdio -monitor none -nic none -no-reboot \
              -kernel "$root/vmlinux" -initrd "$root/initramfs.cpio.gz" \
              -append "console=ttyS0 rdinit=/init vs_minimum_entropy=seeded vs_minimum_certs=$trust panic=1" > "$raw" 2>&1 || status=$?
            tr -d '\r' < "$raw" > "$console"
            cat "$console"
            printf 'Malta guest %s emulator_exit=%s\n' "$trust" "$status"
            if [ "$status" -ne 0 ] \
                || ! grep -aFxq 'VS_MINIMUM_BOOT_OK kernel=4.9.0-13-4kc-malta loopback=127.0.0.1' "$console" \
                || ! grep -aEq '^VS_MALTA_GUEST_CONTROL mips(el)? lo$' "$console" \
                || ! grep -aFxq 'VS_MINIMUM_PTY_READY devpts=true ptmx=true' "$console" \
                || ! grep -aFxq 'VS_MINIMUM_CORE_VERSION_OK v2.33.2' "$console" \
                || ! grep -aFxq 'VS_MINIMUM_GLIBC_VERSION glibc=2.28' "$console" \
                || ! grep -aFxq 'VS_MINIMUM_ENTROPY_MODE seeded' "$console" \
                || ! grep -aFxq 'VS_MINIMUM_ENTROPY_CREDIT_OK bits=512' "$console" \
                || ! grep -aEq '^VS_MINIMUM_ENTROPY phase=before_sdk bits=[0-9]+ readable=1$' "$console" \
                || ! grep -aEq '^VS_MINIMUM_ENTROPY phase=after_sdk bits=[0-9]+ readable=[01]$' "$console" \
                || ! grep -aFxq "VS_MINIMUM_CA_MODE $trust" "$console" \
                || ! grep -aFxq 'VS_MINIMUM_SDK_RUNTIME uid=1000 loaded_fixture_libc=true' "$console" \
                || ! grep -aFq 'Restarting system' "$console" \
                || grep -aq 'Kernel panic' "$console"; then
              overall=1
              continue
            fi
            if [ "$trust" = debian ]; then
              grep -aFxq 'VS_MINIMUM_CA_BUILDER debian_ca=true builder_ok=true missing_platform_roots=false' "$console" \
                && grep -aEq '^VS_MINIMUM_SDK_OK \{' "$console" \
                && ! grep -aq '^VS_MINIMUM_BOOT_FAILURE ' "$console" || overall=1
            else
              grep -aFxq 'VS_MINIMUM_CA_BUILDER debian_ca=false builder_ok=false missing_platform_roots=true' "$console" \
                && grep -aEq '^VS_MINIMUM_SDK_START_OBSERVATION .*"native_health_http_status":200[,}]' "$console" \
                && grep -aFxq 'VS_MINIMUM_SDK_FAILURE_CLEANUP exact_exit_and_lease_release=true' "$console" \
                && grep -aFxq 'VS_MINIMUM_BOOT_FAILURE sdk_runtime' "$console" \
                && grep -aFxq 'Error: Error(management deadline exceeded while attempting to start managed instance)' "$console" || overall=1
            fi
          done
          exit "$overall"
      - name: Preserve only guest consoles and input checksums
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debian-stretch-malta-sdk-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/vs-malta-stretch-sdk/runs/guest-console-*.log
            ${{ runner.temp }}/vs-malta-stretch-sdk/boot/prepared-boot-fixture.json
            ${{ runner.temp }}/vs-malta-stretch-sdk/guest-runtime-sha256.txt
          if-no-files-found: warn
