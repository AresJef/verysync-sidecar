name: R33 root SSH password proof

on:
  push:
    branches: [ci/r33-synthetic-20261124]
    paths:
      - '.github/workflows/r33-root-password-ssh.yml'
      - 'tests/r33-root-login/**'

permissions:
  contents: read

jobs:
  root-password:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out the exact synthetic fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise one password prompt in a disposable container
        shell: bash
        run: |
          set -euo pipefail
          r33_dir="$(mktemp -d)"
          r33_image="r33-root-fixture:${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          trap 'docker image rm "$r33_image" >/dev/null 2>&1 || true; rm -r -- "$r33_dir"' EXIT
          cat > "$r33_dir/Dockerfile" <<'DOCKER'
          FROM ubuntu:24.04
          RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends openssh-server python3 && rm -rf /var/lib/apt/lists/*
          DOCKER
          docker build --quiet -t "$r33_image" "$r33_dir"
          docker run --rm --network none --env R33_DISPOSABLE_ROOT_PROBE=local-synthetic-container \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/r33-root-login,dst=/fixture,readonly" \
            "$r33_image" /usr/bin/python3 -B /fixture/tests/test_root_password.py
