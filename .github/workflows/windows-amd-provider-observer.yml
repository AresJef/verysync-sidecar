name: Windows AMD64 upgrade provider diagnosis

on:
  push:
    branches: [ci/windows-amd-provider-observer-20261119-01a1ca9b]
    paths:
      - .github/workflows/windows-amd-provider-observer.yml
      - scripts/run-isolated-engine-tests.py
      - tests/upgrade_engine.rs

permissions:
  contents: read

jobs:
  provider:
    if: github.repository == 'AresJef/verysync-sidecar' && github.ref == 'refs/heads/ci/windows-amd-provider-observer-20261119-01a1ca9b'
    name: Check the real upgrade route with bounded relay timing
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Bind the probe to the exact candidate and runner architecture
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = X64
          base=83942f58532cbad796a1d89aaee1fe9e2b04df85
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base^{tree}")" = 054c09ee2d25e7b8bc8f90fdc758c30fe4c5fd04
          test -z "$(git diff "$base" HEAD -- src Cargo.toml Cargo.lock releases)"
          git log -1 --format='%H %T %P'
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare both pinned programs privately
        run: |
          python scripts/prepare-test-engine.py prepare --package windows-amd64-standard --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
          python scripts/prepare-test-engine.py prepare --upgrade-source --package windows-amd64-standard --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Require the original provider check, real upgrade and owned exit
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target upgrade_engine --allow-upgrade-metadata --serve-pinned-upgrade-archive
          --test-filter kernel_provider_upgrade_replaces_only_the_owned_old_copy
          --evidence-dir "${{ runner.temp }}/vs-provider-relay-timing"
      - name: Check exact baseline fixture cleanup
        if: always()
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Check exact older fixture cleanup
        if: always()
        run: python scripts/prepare-test-engine.py check-cleanup --upgrade-source
      - name: Retain the bounded timing observation
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-amd64-provider-relay-timing
          path: ${{ runner.temp }}/vs-provider-relay-timing/proxy-observations.json
          if-no-files-found: warn
