name: Focused candidate follow-up

on:
  push:
    branches: ['verify/r23/pretrial-and-intel-74c1785']

permissions:
  contents: read

jobs:
  inspect-preparation:
    name: Read original macOS ARM64 preparation evidence
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read the original Actions artifact within this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/r23-preparation.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          artifact=/repos/AresJef/verysync-sidecar/actions/artifacts/14519654541
          gh api "$artifact" > "$scratch/metadata.json"
          gh api "$artifact/zip" > "$scratch/preparation.zip"
          python3 scripts/r23-resource-pretrial-audit.py "$scratch/metadata.json" "$scratch/preparation.zip"
  intel-fixture:
    name: Verify native planner and transport fixtures on Intel macOS
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: macos-15-intel
    timeout-minutes: 18
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the full catalog and exact hosted compiler
        run: |
          test "$(uname -m)" = x86_64
          git rev-parse HEAD 'HEAD^{tree}'
          python3 -B -m unittest discover -s scripts/tests -p test_native_diagnostic_selection.py
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
      - name: Rerun the original public and synthetic transport suites
        run: >-
          cargo +"$TEST_TOOLCHAIN" test --lib --test client_contract
          --test transport_contract --test managed_contract --test events_contract
          --test devices_contract --test invitations_contract --test network_contract
          --test sync_observation_contract --test releases --locked
