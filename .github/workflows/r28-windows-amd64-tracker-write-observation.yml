name: Observe the Windows AMD64 tracker write result

on:
  push:
    branches: ['verify/r28/windows-amd64-tracker-write-observation']

permissions:
  contents: read

jobs:
  exact-native-tracker-observation:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: windows-2022
    timeout-minutes: 16
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Require the fixed candidate and the scoped diagnostic additions
        run: |
          test "$(git rev-parse HEAD^)" = 99ee1036b70b9b115df26ca76c57559e7dc038a3
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/r28-windows-amd64-tracker-write-observation.yml' ':!tests/common/tracker_observation_cases.rs'
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare the exact owned Windows AMD64 engine
        run: >-
          python scripts/prepare-test-engine.py prepare --package windows-amd64-standard
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Observe native tracker writes and preserve the original acceptance
        run: >-
          python scripts/run-official-tracker-test.py --toolchain "$TEST_TOOLCHAIN"
          --allow-official-tracker --evidence-dir "${{ runner.temp }}/vs-official-tracker-write-observation"
      - name: Require exact engine cleanup after the observed outcome
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
