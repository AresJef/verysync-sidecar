name: Bounded native UDP qualification on the stable core

on:
  push:
    branches: [test/native-udp-round1-20261120]

permissions:
  contents: read

jobs:
  native:
    if: github.run_attempt == 1
    name: Hosted Linux AMD64, native STUN round one
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-gnu
    steps:
      - name: Check out the isolated test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check out the accepted SDK tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 99ee1036b70b9b115df26ca76c57559e7dc038a3
          path: stable
          persist-credentials: false
      - name: Build the native fixture on the fixed candidate
        working-directory: stable
        run: |
          test "$(git rev-parse HEAD)" = 99ee1036b70b9b115df26ca76c57559e7dc038a3
          test "$(git rev-parse 'HEAD^{tree}')" = 3da7a8516223b8502fae1fc9aef7fe4033c76dcf
          test -z "$(git status --porcelain)"
          cp "$GITHUB_WORKSPACE/.github/field/observe_native_udp_binding.rs" examples/
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" build --locked --example observe_native_udp_binding
      - name: Prepare the matching pinned private program
        working-directory: stable
        run: >-
          python scripts/prepare-test-engine.py prepare --package linux-amd64-standard
          --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Verify a native UDP binding on the specifically approved service
        run: >-
          python3 -IB .github/field/native_binding_round.py linux
          --engine "$VERYSYNC_TEST_BINARY" --sha "$VERYSYNC_TEST_BINARY_SHA256"
          --driver "$GITHUB_WORKSPACE/stable/target/debug/examples/observe_native_udp_binding"
          --receipt "$RUNNER_TEMP/native-stun-round1.json"
      - name: Require exact prepared-image cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        working-directory: stable
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Retain the address-free result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stable-native-udp-round1-${{ github.run_id }}
          path: ${{ runner.temp }}/native-stun-round1.json
          retention-days: 7
          if-no-files-found: warn
