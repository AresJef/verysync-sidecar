name: Qualify the public VerySync relay directory

on:
  push:
    branches: [test/relay-directory-20261120]

permissions:
  contents: read

jobs:
  directory:
    if: github.run_attempt == 1 && github.actor == 'AresJef'
    name: Fetch the public directory without a test identity
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check directory availability and first-party relay candidates
        run: |
          python3 -IB - <<'PY'
          import ipaddress
          import json
          import re
          from pathlib import Path
          import os
          from urllib.error import HTTPError
          from urllib.parse import parse_qs, urlsplit
          from urllib.request import Request, HTTPRedirectHandler, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None

          url="https://relays.verysync.cn/endpoint"
          report={"directory":url,"own_service_metadata_sent":False,"engine_started":False,
                  "individual_relays_contacted":0,"public_link_status":"unavailable"}
          try:
              with build_opener(NoRedirect()).open(Request(url,headers={"Accept":"application/json"}),timeout=10) as response:
                  report["http_status"]=response.status
                  payload=response.read(262145)
                  assert len(payload)<=262144
                  catalog=json.loads(payload)
                  entries=catalog.get("relays",[]) if isinstance(catalog,dict) else catalog
                  if not isinstance(entries,list):
                      raise ValueError("unrecognized directory")
                  hostnames=[]
                  candidates=[]
                  for entry in entries[:200]:
                      meta=entry if isinstance(entry,dict) else {}
                      value=meta.get("url",entry)
                      if not isinstance(value,str): continue
                      url=urlsplit(value)
                      if url.scheme!="relay" or not url.hostname:
                          continue
                      hostnames.append(url.hostname.rstrip(".").lower())
                      try:
                          ip=ipaddress.IPv4Address(url.hostname)
                          port=url.port
                      except ValueError:
                          continue
                      if not (ip.is_global and port is not None and port>0):
                          continue
                      identity=parse_qs(url.query).get("id",[""])[0]
                      if not re.fullmatch(r"[A-Z2-7]{7}(?:-[A-Z2-7]{7}){7}",identity):
                          continue
                      loc=meta.get("location",{})
                      country=loc.get("country","") if isinstance(loc,dict) else ""
                      country=country if isinstance(country,str) and re.fullmatch("[A-Z]{2}",country) else None
                      candidates.append((str(ip),port,identity,country))
                  vendor=[h for h in hostnames if h=="verysync.cn" or h.endswith(".verysync.cn")]
                  report.update(public_link_status="catalog_parsed",listed_entries=len(entries),
                                usable_relay_urls=len(hostnames),vendor_dns_names=sorted(set(vendor)),
                                addresses_published=False)
                  candidates.sort(key=lambda row: (row[3] not in ("CN","HK","SG","JP"),row[1]!=443,row[0],row[1]))
                  report["public_ipv4_pinned_candidates"]=len(candidates)
                  report["public_directory_shortlist"]=[{"host":host,"port":port,"relay_cert_id":identity,"country":country}
                      for host,port,identity,country in candidates[:3]]
          except (OSError, ValueError, AssertionError) as error:
              report["error"]=type(error).__name__
              if isinstance(error,HTTPError): report["http_status"]=error.code
          (Path(os.environ["RUNNER_TEMP"])/"relay-directory.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verysync-relay-directory-${{ github.run_id }}
          path: ${{ runner.temp }}/relay-directory.json
          retention-days: 7
          if-no-files-found: error
