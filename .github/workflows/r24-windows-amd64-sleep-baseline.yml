name: Diagnose the original Windows AMD64 sleep baseline

on:
  push:
    branches: ['verify/r24/windows-amd64-sleep-baseline']

permissions:
  contents: read

jobs:
  native-sleep-baseline:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare the fixed original toolchain and core
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          python scripts/prepare-test-engine.py prepare --package windows-amd64-standard --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Require all original native sleep effects and exact deadlines
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target configuration_engine
          --test-filter sleep_prevention_cases::native_sleep_prevention_tracks_actual_owned_assertions_during_transfer
          --evidence-dir "$RUNNER_TEMP/vs-sleep-idle-baseline"
      - name: Confirm only the exact owned native core is gone
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
