name: Mac resource environment check

# A separate, bounded environment experiment. Existing six-profile collection
# and native acceptance workflows retain their original jobs and gates.
on:
  pull_request:
    paths:
      - .github/workflows/macos-resource-environment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-resource-environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Original resource protocol (${{ matrix.package }} / ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-amd64-standard
            runner: macos-26-intel
            rust: x86_64-apple-darwin
          - package: macos-arm64-standard
            runner: macos-26
            rust: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the same fixed observer and native MSRV
        run: |
          python -m pip install -r scripts/resource-test-requirements.txt
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Verify original measurement and complete-group contracts
        run: python -m unittest discover -s scripts/tests -p 'test_resource_*.py'
      - name: Explicitly prepare the fixed private standard artifact
        run: >-
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Retain this environment's original counter and timer calibration
        run: >-
          python scripts/measure-native-resources.py --stage calibration --timer-calibration
          --evidence-dir "${{ runner.temp }}/vs-resource-environment/calibration"
      - name: Build the exact release workload before acquisition
        run: cargo +"$TEST_TOOLCHAIN" test --release --no-run --features engine-tests,download --test resource_usage_engine --locked
      - name: Require both original complete fresh-process preparation orders
        run: >-
          python scripts/preflight-native-resources.py
          --protocol tests/fixtures/resource-protocol.json --toolchain "$TEST_TOOLCHAIN"
          --cargo "$(python -c 'import shutil; print(shutil.which("cargo"))')"
          --evidence-dir "${{ runner.temp }}/vs-resource-environment/pretrial"
      - name: Collect all four formal and two independent original-order cycles
        run: >-
          python scripts/collect-native-resources.py --stage all
          --protocol tests/fixtures/resource-protocol.json --toolchain "$TEST_TOOLCHAIN"
          --cargo "$(python -c 'import shutil; print(shutil.which("cargo"))')"
          --evidence-dir "${{ runner.temp }}/vs-resource-environment/collection"
      - name: Require exact owned-program cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Preserve all original observations and incomplete attempts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-resource-environment-${{ matrix.package }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vs-resource-environment/**/calibration.json
            ${{ runner.temp }}/vs-resource-environment/**/safe-error.json
            ${{ runner.temp }}/vs-resource-environment/**/pretrial-result.json
            ${{ runner.temp }}/vs-resource-environment/**/collection-state.json
            ${{ runner.temp }}/vs-resource-environment/**/frozen-protocol.json
            ${{ runner.temp }}/vs-resource-environment/**/accepted-group.json
            ${{ runner.temp }}/vs-resource-environment/**/attempt.json
            ${{ runner.temp }}/vs-resource-environment/**/preparation-result.json
            ${{ runner.temp }}/vs-resource-environment/**/quality-result.json
            ${{ runner.temp }}/vs-resource-environment/**/samples.jsonl
            ${{ runner.temp }}/vs-resource-environment/**/events.jsonl
            ${{ runner.temp }}/vs-resource-environment/**/console.log
            ${{ runner.temp }}/vs-resource-environment/**/*.console.log
