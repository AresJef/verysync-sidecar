name: Verify the full packaged authentication and file-history suites

on:
  push:
    branches: [verify/r24/exact-auth-history-f9171fb]

permissions:
  contents: read

jobs:
  native:
    name: Complete packaged authentication and file history (macos-arm64-standard)
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: macos-15
    timeout-minutes: 32
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-aarch64-apple-darwin
      VERYSYNC_TEST_EXPLICIT_TUNNEL: github-actions-isolated-vm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          path: candidate
          ref: f9171fb196948dd378ff8e0d72fe8f5e36605d36
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Reproduce the exact crate with the pinned compiler
        working-directory: candidate
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/verify-auth-history-target"
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          test "$(rustc +"$TEST_TOOLCHAIN" -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          cargo +"$TEST_TOOLCHAIN" package --no-verify --offline --locked
          crate="$CARGO_TARGET_DIR/package/verysync-sidecar-0.1.0-alpha.2.crate"
          RUSTUP_TOOLCHAIN="$TEST_TOOLCHAIN" python3 -B scripts/publish-github-release.py \
            --metadata ../.github/diagnostics/exact-auth-history-f9171fb.json --check-package "$crate"
          mkdir "$RUNNER_TEMP/verify-auth-history-package"
          tar -xzf "$crate" -C "$RUNNER_TEMP/verify-auth-history-package"
      - name: Prepare the original pinned protocol peer environment
        working-directory: candidate
        run: >-
          python3 -B scripts/prepare-storage-test-environment.py
          --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Prepare the matching private official engine
        working-directory: candidate
        run: >-
          python3 -B scripts/prepare-test-engine.py prepare --package macos-arm64-standard
          --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Run all original authentication cases on the disposable runner
        id: authentication
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verify-auth-history-package/verysync-sidecar-0.1.0-alpha.2"
          python3 -B scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target authentication_engine --evidence-dir "$RUNNER_TEMP/verify-authentication"
      - name: Confirm exact process cleanup after authentication
        id: auth_cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        working-directory: candidate
        run: python3 -B scripts/prepare-test-engine.py check-cleanup
      - name: Run all original file-history cases on the disposable runner
        id: history
        if: steps.auth_cleanup.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verify-auth-history-package/verysync-sidecar-0.1.0-alpha.2"
          python3 -B scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target file_history_engine --evidence-dir "$RUNNER_TEMP/verify-file-history"
      - name: Confirm exact process cleanup after file history
        id: history_cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        working-directory: candidate
        run: python3 -B scripts/prepare-test-engine.py check-cleanup
      - name: Require both original suites and cleanup to pass
        if: always()
        env:
          AUTHENTICATION: ${{ steps.authentication.outcome }}
          AUTHENTICATION_CLEANUP: ${{ steps.auth_cleanup.outcome }}
          HISTORY: ${{ steps.history.outcome }}
          HISTORY_CLEANUP: ${{ steps.history_cleanup.outcome }}
        run: |
          printf 'Authentication %s; cleanup %s; file history %s; cleanup %s\n' \
            "$AUTHENTICATION" "$AUTHENTICATION_CLEANUP" "$HISTORY" "$HISTORY_CLEANUP"
          test "$AUTHENTICATION" = success &&
          test "$AUTHENTICATION_CLEANUP" = success &&
          test "$HISTORY" = success &&
          test "$HISTORY_CLEANUP" = success
