name: R33 synthetic operator connector in private Linux networking

on:
  push:
    branches:
      - ci/r33-synthetic-20261124
    paths:
      - .github/workflows/r33-private-linux-connector.yml
      - scripts/r33/linux-private-connector-control.py

permissions:
  contents: read

jobs:
  private-connector:
    name: Synthetic private connector and ownership
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Check out the exact synthetic fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the simulated authorization channel and clean exit
        run: /usr/bin/python3 -B scripts/r33/linux-private-connector-control.py
