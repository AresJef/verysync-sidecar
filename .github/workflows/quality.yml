name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Format, build, lint and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 check --all-targets --locked
      - run: cargo +1.99.1 test --lib --locked
      - run: cargo +1.99.1 clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.99.1 doc --no-deps --all-features --locked

  msrv:
    name: Minimum Rust 1.85
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --all-targets --locked
      - run: cargo +1.85.0 test --lib --locked
