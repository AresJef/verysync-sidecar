name: Upgrade receipts and read-only recovery

on:
  push:
    branches:
      - 'ci/upgrade-receipts-round-20261127*'
      - 'ci/formal-candidate/upgrade-receipts-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-receipts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Freeze one exact candidate archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare pinned Cargo and locked dependencies
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 fetch --locked
      - name: Build and record the checkout's exact crate
        run: >-
          python scripts/prepare-control-reliability-consumer.py --toolchain 1.85.0
          --package-only --work "$RUNNER_TEMP/upgrade-package-work"
          --evidence "$RUNNER_TEMP/upgrade-frozen-package"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upgrade-frozen-package
          path: ${{ runner.temp }}/upgrade-frozen-package
          if-no-files-found: error

  native:
    name: Upgrade receipts (${{ matrix.package }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: macos-amd64-standard, runner: macos-15-intel, rust: x86_64-apple-darwin}
          - {package: macos-arm64-standard, runner: macos-15, rust: aarch64-apple-darwin}
          - {package: windows-amd64-standard, runner: windows-2022, rust: x86_64-pc-windows-msvc}
          - {package: windows-arm64-standard, runner: windows-11-arm, rust: aarch64-pc-windows-msvc}
          - {package: linux-amd64-standard, runner: ubuntu-24.04, rust: x86_64-unknown-linux-gnu}
          - {package: linux-arm64-standard, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu}
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install and identify the native Rust toolchain
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare the exact target and previous programs
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/upgrade-evidence"
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}" \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" | tee "$RUNNER_TEMP/upgrade-evidence/target.json"
          python scripts/prepare-test-engine.py prepare --upgrade-source --package "${{ matrix.package }}" \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV" | tee "$RUNNER_TEMP/upgrade-evidence/previous.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
        with:
          name: upgrade-frozen-package
          path: ${{ runner.temp }}/upgrade-frozen-package
      - name: Verify and independently unpack the frozen crate
        run: |
          set -o pipefail
          python scripts/prepare-upgrade-receipt-consumer.py --toolchain "$TEST_TOOLCHAIN" \
            --work "$RUNNER_TEMP/upgrade-package-consumer" \
            --identity "$RUNNER_TEMP/upgrade-frozen-package/package.json" \
            --crate "$RUNNER_TEMP/upgrade-frozen-package/candidate.crate" \
            | tee "$RUNNER_TEMP/upgrade-evidence/consumer.json"
      - name: Check HTTP stages from an external package consumer
        run: |
          set -o pipefail
          cargo +"$TEST_TOOLCHAIN" test --locked --offline \
            --manifest-path "$RUNNER_TEMP/upgrade-package-consumer/consumer/Cargo.toml" \
            --test upgrade_receipt_contract -- --nocapture \
            | tee "$RUNNER_TEMP/upgrade-evidence/http-contract.log"
      - name: Prepare Linux process observer
        if: runner.os == 'Linux'
        run: |
          if ! command -v strace >/dev/null; then
            strace_dir=$(mktemp -d "$RUNNER_TEMP/strace.XXXXXX")
            (
              cd "$strace_dir"
              apt-get download strace
              dpkg-deb -x ./strace_*.deb "$strace_dir/unpacked"
            )
            printf '%s\n' "$strace_dir/unpacked/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Test native CLI exit handling from the unpacked crate
        if: always() && env.VERYSYNC_TEST_UPGRADE_SOURCE_BINARY != ''
        run: |
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target upgrade_engine --test-filter stopped_cli_blocked_check \
            --upgrade-consumer "$RUNNER_TEMP/upgrade-package-consumer/consumer" \
            --evidence-dir "$RUNNER_TEMP/upgrade-evidence/cli-check"
      - name: Test both same-attempt unknown upgrades from the unpacked crate
        if: always() && env.VERYSYNC_TEST_UPGRADE_SOURCE_BINARY != ''
        run: |
          result=0
          trace="$RUNNER_TEMP/s29-native-trace"
          raw="$RUNNER_TEMP/upgrade-evidence/native-same-attempt"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target upgrade_engine --test-filter native_same_attempt_observes \
            --upgrade-consumer "$RUNNER_TEMP/upgrade-package-consumer/consumer" \
            --upgrade-process-trace "$trace" --evidence-dir "$raw" || result=1
          if [ -f "$trace/observer.stderr" ]; then
            cp "$trace/observer.stderr" "$raw/observer.stderr"
          fi
          python scripts/trace-upgrade-recovery.py --verify --trace "$trace/intermediate.json" \
            --log "$raw/upgrade-engine.log" --output "$raw/independent-process-witness.json" \
            --scoped-trace "$raw/owned-process-events.json" || result=1
          if [ -f "$trace/intermediate.json" ]; then
            rm "$trace/intermediate.json"
          fi
          exit "$result"
      - name: Compare the three original upgrade routes and their data effects
        if: always() && env.VERYSYNC_TEST_UPGRADE_SOURCE_BINARY != ''
        run: |
          result=0
          for selector in kernel_provider_upgrade kernel_streamed_archive_upload stopped_owner_cli; do
            python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
              --test-target upgrade_engine --test-filter "$selector" \
            --allow-upgrade-metadata --serve-pinned-upgrade-archive \
            --evidence-dir "$RUNNER_TEMP/upgrade-evidence/original-$selector" || result=1
          done
          exit "$result"
      - name: Verify no task-owned core or upgrade source remains
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: |
          set -o pipefail
          result=0
          python scripts/prepare-test-engine.py check-cleanup | tee "$RUNNER_TEMP/upgrade-evidence/target-cleanup.log" || result=1
          if [ -n "$VERYSYNC_TEST_UPGRADE_SOURCE_BINARY" ]; then
            python scripts/prepare-test-engine.py check-cleanup --upgrade-source | tee "$RUNNER_TEMP/upgrade-evidence/previous-cleanup.log" || result=1
          fi
          exit "$result"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: upgrade-evidence-${{ matrix.package }}
          path: ${{ runner.temp }}/upgrade-evidence
