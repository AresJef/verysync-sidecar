name: Diagnose the original Linux ARM64 selective-directory outcome
on:
  push:
    branches: ['verify/r24/linux-arm64-selective-directories']

permissions:
  contents: read

jobs:
  selective-directories:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-aarch64-unknown-linux-gnu
      VERYSYNC_BANDWIDTH_PHASE: acceptance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare fixed native Rust and exact isolated VerySync
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          python scripts/prepare-test-engine.py prepare --package linux-arm64-standard --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Require the original ordered suite and its strict directory outcome
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target sync_observation --evidence-dir "$RUNNER_TEMP/vs-selective-directories"
      - name: Confirm only the exact owned native core is gone
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
