name: R33 synthetic Linux SSH password
on:
  push:
    branches: [ci/r33-ssh-password-20261124]
    paths: ['tools/r33-synthetic/tests/test_linux_password.py', '.github/workflows/r33-synthetic-ssh-password.yml']
permissions:
  contents: read
jobs:
  verify:
    name: Disposable Linux password transport
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use two actual OS users and stock SSH on loopback
        shell: bash
        run: |
          cd tools/r33-synthetic
          PYTHONPATH="$PWD" /usr/bin/python3 -B tests/test_linux_password.py
