name: RC7 managed repair regressions

on:
  push:
    branches: ['ci/rc7-repair/stage-1-20261125']

permissions:
  contents: read

jobs:
  managed:
    name: repair on ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-amd64-standard
            runner: macos-15-intel
            rust: x86_64-apple-darwin
          - package: macos-arm64-standard
            runner: macos-15
            rust: aarch64-apple-darwin
          - package: windows-amd64-standard
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
          - package: windows-arm64-standard
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
          - package: linux-amd64-standard
            runner: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
          - package: linux-arm64-standard
            runner: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Check exact source and prepare locked native toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Run native admission and reuse controls
        id: controls
        continue-on-error: true
        run: >-
          cargo +"$TEST_TOOLCHAIN" test --locked --offline --lib managed:: -- --nocapture
      - name: Record actual Windows service and ordinary owner outcomes
        if: runner.os == 'Windows'
        id: permissions
        continue-on-error: true
        shell: pwsh
        run: ./scripts/run-windows-managed-permissions.ps1 -Toolchain $env:TEST_TOOLCHAIN
      - name: Prepare fixed core and its pinned earlier upgrade source
        run: |
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}" --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
          python scripts/prepare-test-engine.py prepare --upgrade-source --package "${{ matrix.package }}" --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Exercise managed regressions with the official core
        id: lifecycle
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --managed-repair-regressions --evidence-dir "${{ runner.temp }}/vss-repair-regressions"
      - name: Require exact cleanup of both official program fixtures
        if: always() && env.VERYSYNC_TEST_BINARY != '' && env.VERYSYNC_TEST_UPGRADE_SOURCE_BINARY != ''
        run: |
          python scripts/prepare-test-engine.py check-cleanup
          python scripts/prepare-test-engine.py check-cleanup --upgrade-source
      - name: Require both original outcomes
        if: always()
        env:
          CONTROLS: ${{ steps.controls.outcome }}
          PERMISSIONS: ${{ steps.permissions.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
        run: |
          test "$CONTROLS" = success
          test "$LIFECYCLE" = success
          if [ "$RUNNER_OS" = Windows ]; then
            test "$PERMISSIONS" = success
          fi
