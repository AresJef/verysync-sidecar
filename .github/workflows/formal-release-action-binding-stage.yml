name: Dispatch the exact candidate quality pilot
on:
  push:
    branches: [ci/formal-release-action-binding-20261119-01a1ca9b]
    paths: [.github/workflows/formal-release-action-binding-stage.yml]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'AresJef/verysync-sidecar' && github.ref == 'refs/heads/ci/formal-release-action-binding-20261119-01a1ca9b'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_BRANCH: ci/formal-release-quality-candidate-20261119-01a1ca9b
      CANDIDATE_SOURCE: 9d7dd22e0bd45d492d77709554c2f23a13eb148f
      CANDIDATE_TREE: 71aa0f4ba9a9a70178da337a9f7d75780770f449
    steps:
      - name: Request one quality run against the verified candidate ref
        shell: bash
        run: |
          set -euo pipefail
          repo='repos/AresJef/verysync-sidecar'
          current=$(gh api "$repo/git/ref/heads/$CANDIDATE_BRANCH" --jq '.object.sha')
          test "$current" = "$CANDIDATE_SOURCE"
          tree=$(gh api "$repo/git/commits/$CANDIDATE_SOURCE" --jq '.tree.sha')
          test "$tree" = "$CANDIDATE_TREE"
          quality=$(gh api "$repo/actions/workflows/quality.yml" --jq 'select(.path == ".github/workflows/quality.yml").id')
          test "$quality" = '415476435'
          previous=$(gh api "$repo/actions/runs?head_sha=$CANDIDATE_SOURCE&event=workflow_dispatch&per_page=2" --jq '.total_count')
          test "$previous" = '0'
          gh api --method POST "$repo/actions/workflows/quality.yml/dispatches" -f ref="$CANDIDATE_BRANCH"
          printf 'Dispatched the registered quality workflow for source=%s tree=%s\n' "$CANDIDATE_SOURCE" "$CANDIDATE_TREE"
