name: Route probe for additional platforms
on:
  push:
    branches: ['ci/formal-candidate/**']

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'pull_request' && github.event.pull_request.draft && github.head_ref == 'ci/native-stop-diagnostics-20261117-01a1ca9b' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      EXACT_SOURCE: 0cb2613797f3d3e327996e0bf034ec72b9dab0e2
      EXACT_TREE: 30dac6ec75db9d3df745f4c370c95c14d6b52ec5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '0cb2613797f3d3e327996e0bf034ec72b9dab0e2'
          persist-credentials: false
      - name: Bind this probe to the exact staged candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ci/formal-candidate/routing-check-20261119-01a1ca9b'
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXACT_TREE"
          test -z "$(git status --porcelain)"
          printf 'Exact route probe source=%s tree=%s\n' "$EXACT_SOURCE" "$EXACT_TREE"
      - name: Require every original selection from the actual push event
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p test_emulated_platform_selection.py
          python3 -B -m unittest discover -s scripts/tests -p test_publish_github_release.py
          GITHUB_OUTPUT="$RUNNER_TEMP/owned-formal-push-matrix" python3 -B scripts/select-emulated-platforms.py
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = json.loads(Path(".github/other-emulated-matrix.json").read_text())
          output = Path(os.environ["RUNNER_TEMP"]) / "owned-formal-push-matrix"
          rows = json.loads(output.read_text().strip().removeprefix("matrix="))["include"]
          assert len(rows) == 8 and rows == expected
          print("Real first-party push produced the exact eight original additional-platform rows.")
          PY
