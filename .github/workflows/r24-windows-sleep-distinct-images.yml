name: Distinguish owned Windows AMD64 sleep requests by role

on:
  push:
    branches: ['verify/r24/windows-sleep-distinct-images']

permissions:
  contents: read

jobs:
  native-sleep-baseline:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare the fixed original toolchain and core
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          python scripts/prepare-test-engine.py prepare --package windows-amd64-standard --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Observe two native images through all original sleep effects and deadlines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vs-sleep-role-root'
          if (Test-Path -LiteralPath $root) { throw 'Expected a fresh private runtime root' }
          New-Item -Path $root -ItemType Directory | Out-Null
          $env:TEMP = $root
          $env:TMP = $root
          python scripts/run-isolated-engine-tests.py --toolchain $env:TEST_TOOLCHAIN --test-target configuration_engine --test-filter sleep_prevention_cases::native_sleep_prevention_tracks_actual_owned_assertions_during_transfer --evidence-dir (Join-Path $env:RUNNER_TEMP 'vs-sleep-role-evidence')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the exact private role executable paths after every outcome
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vs-sleep-role-root'
          $caseDirs = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'vsawake-*' -ErrorAction SilentlyContinue)
          if ($caseDirs.Count -gt 1 -or @($caseDirs | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) {
            throw 'The isolated role directory could not be identified exactly'
          }
          foreach ($case in $caseDirs) {
            foreach ($role in @('a.exe', 'b.exe')) {
              $path = Join-Path $case.FullName $role
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                if ((Get-Item -LiteralPath $path).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Unexpected role image link' }
                $env:VERYSYNC_TEST_BINARY = $path
                python scripts/prepare-test-engine.py check-cleanup
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }
      - name: Confirm only the exact owned native core is gone
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
