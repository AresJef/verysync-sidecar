name: Observe Linux AMD64 local announcement and actual normal exits

on:
  push:
    branches: ['verify/r28/linux-amd64-local-announcement-phases']

permissions:
  contents: read

jobs:
  linux-amd64-announcement-phases:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-gnu
      VERYSYNC_TEST_LOCAL_ANNOUNCEMENT: github-actions-isolated-vm
      VERYSYNC_TEST_EXPLICIT_TUNNEL: github-actions-isolated-vm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Bind the candidate and the observations-only test change
        run: |
          test "$(git rev-parse HEAD^)" = 99ee1036b70b9b115df26ca76c57559e7dc038a3
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/r28-linux-amd64-local-announcement-phases.yml' ':!tests/common/local_announcement_cases.rs'
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare the same exact isolated Linux engine
        run: >-
          python scripts/prepare-test-engine.py prepare --package linux-amd64-standard
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Require the original native network suite with exit-phase observations
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target network --allow-private-discovery --test-filter actual_
          --evidence-dir "${{ runner.temp }}/vs-network-proxy"
      - name: Require exact owned-executable cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
