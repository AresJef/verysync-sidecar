name: Calibrate actual Windows ARM64 IPv4 and IPv6 TCP data

on:
  push:
    branches: ['verify/r24/windows-arm64-tun-data']

permissions:
  contents: read

jobs:
  owned-tcp-control:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: windows-11-arm
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Build the independent peer with exact native Rust and locked inputs
        shell: pwsh
        run: |
          $toolchain = '1.85.0-aarch64-pc-windows-msvc'
          $manifest = '.github/diagnostics/windows-arm64-tun-peer/Cargo.toml'
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the exact ARM64 Rust toolchain' }
          rustc "+$toolchain" -vV
          if ($LASTEXITCODE -ne 0) { throw 'Could not confirm native Rust' }
          cargo "+$toolchain" fetch --manifest-path $manifest --locked
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch calibration inputs' }
          cargo "+$toolchain" test --manifest-path $manifest --locked --offline
          if ($LASTEXITCODE -ne 0) { throw 'Exact calibration sample check failed' }
          cargo "+$toolchain" build --manifest-path $manifest --locked --offline
          if ($LASTEXITCODE -ne 0) { throw 'Native independent receiver could not be built' }
      - name: Require six native qWAVE data controls and exact cleanup
        shell: pwsh
        run: |
          $peer = Resolve-Path -LiteralPath '.github/diagnostics/windows-arm64-tun-peer/target/debug/verysync-isolated-tun-peer.exe'
          $python = (Get-Command python -CommandType Application).Source
          & $python -B -c 'import platform; assert platform.machine().upper() == "ARM64"'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the native ARM64 socket sender' }
          ./.github/diagnostics/windows-arm64-wintun-qualification.ps1 -TcpPeer "$peer" -Python "$python"
