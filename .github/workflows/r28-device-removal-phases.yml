name: Observe Linux AMD64 explicit device removal phases

on:
  push:
    branches: ['verify/r28/linux-amd64-device-removal-phases']

permissions:
  contents: read

jobs:
  linux-amd64-removal-phases:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-gnu
      VERYSYNC_TEST_LOCAL_ANNOUNCEMENT: github-actions-isolated-vm
      VERYSYNC_TEST_EXPLICIT_TUNNEL: github-actions-isolated-vm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Bind phase observations to the current candidate and locked dependencies
        run: |
          test "$(git rev-parse HEAD^)" = 878a27a5090991a18b7c8bee7d66653df720cff1
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/r28-device-removal-phases.yml' ':!src/client/device_control.rs'
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare the exact official Linux AMD64 baseline
        run: |
          python scripts/prepare-test-engine.py prepare --package linux-amd64-standard --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Run the original device suite with phase observations
        id: original
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target devices --evidence-dir "$RUNNER_TEMP/vs-devices-proxy"
      - name: Observe three freshly isolated explicit removals within the original deadlines
        id: focused
        continue-on-error: true
        run: |
          status=0
          for trial in 1 2 3; do
            python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
              --test-target devices --test-filter actual_explicit_disconnect_and_remove_preserves_files \
              --evidence-dir "$RUNNER_TEMP/vs-devices-focused-$trial" || status=1
            python scripts/prepare-test-engine.py check-cleanup || exit 1
          done
          exit "$status"
      - name: Require exact owned-executable cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Require every original and focused observation to pass
        if: always()
        env:
          ORIGINAL_OUTCOME: ${{ steps.original.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
        run: test "$ORIGINAL_OUTCOME" = success && test "$FOCUSED_OUTCOME" = success
