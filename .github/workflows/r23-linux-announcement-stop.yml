name: Observe original Linux network acceptance shutdown
on:
  push:
    branches: [verify/r23/linux-announcement-stop]
permissions:
  contents: read
jobs:
  linux-announcement-stop:
    name: Original Linux AMD64 network acceptance with shutdown stages
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-gnu
      VERYSYNC_TEST_LOCAL_ANNOUNCEMENT: github-actions-isolated-vm
      VERYSYNC_TEST_EXPLICIT_TUNNEL: github-actions-isolated-vm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare the same native Rust compiler and exact official program
        run: |
          git rev-parse HEAD HEAD^{tree}
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          python scripts/prepare-test-engine.py prepare --package linux-amd64-standard \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Preserve the original actual network suite and its normal shutdown deadlines
        run: |
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target network --allow-private-discovery --test-filter actual_ \
            --evidence-dir "$RUNNER_TEMP/vs-r23-linux-announcement-stop"
      - name: Require exact owned program cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
