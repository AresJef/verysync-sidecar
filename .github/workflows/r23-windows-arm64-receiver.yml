name: Alternate Windows ARM64 receiver feasibility

on:
  push:
    branches: ['verify/r23/windows-arm64-vs2026-receiver']
    paths: ['.github/workflows/r23-windows-arm64-receiver.yml']

permissions:
  contents: read

jobs:
  probe:
    name: Native ARM64 socket and disconnected firmware controls
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 8
    steps:
      - name: Check the alternate native host and raw Winsock option
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArch = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($arch -ne 'Arm64' -or $processArch -ne 'Arm64') {
            throw 'Expected native Windows ARM64 PowerShell'
          }
          $services = @('vmms', 'vmcompute') | ForEach-Object {
            $service = Get-Service -Name $_ -ErrorAction SilentlyContinue
            if ($service) { "$_=" + $service.Status.ToString() } else { "$_=absent" }
          }
          Write-Output ("ARM64_RECEIVER_HOST " + (ConvertTo-Json -Compress -InputObject @{
            os_architecture = $arch
            process_architecture = $processArch
            build = [Environment]::OSVersion.Version.Build
            image = $env:ImageOS
            image_version = $env:ImageVersion
            services = @($services)
          }))

          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $sender = $null
          $receiver = $null
          try {
            $listener.Start()
            $sender = [Net.Sockets.TcpClient]::new([Net.Sockets.AddressFamily]::InterNetwork)
            $address = [Net.IPEndPoint]$listener.LocalEndpoint
            $sender.Connect($address.Address, $address.Port)
            $receiver = $listener.AcceptTcpClient()
            $receiver.ReceiveTimeout = 3000
            $sender.SendTimeout = 3000
            foreach ($selection in @(16, 32, 0)) {
              $hasValue = $false
              $readBack = $null
              $nativeError = $null
              try {
                $sender.Client.SetSocketOption([Net.Sockets.SocketOptionLevel]::IP,
                  [Net.Sockets.SocketOptionName]::TypeOfService, [int]$selection)
                $hasValue = $true
                $readBack = $sender.Client.GetSocketOption([Net.Sockets.SocketOptionLevel]::IP,
                  [Net.Sockets.SocketOptionName]::TypeOfService)
              }
              catch {
                $cause = $_.Exception
                while ($cause.InnerException) { $cause = $cause.InnerException }
                if ($cause -isnot [Net.Sockets.SocketException]) { throw }
                $nativeError = $cause.NativeErrorCode
              }
              $sender.GetStream().WriteByte([byte]$selection)
              if ($receiver.GetStream().ReadByte() -ne $selection) {
                throw 'The isolated TCP sample did not reach its receiver'
              }
              Write-Output ("ARM64_RAW_SOCKET_CONTROL " + (ConvertTo-Json -Compress -InputObject @{
                selected = $selection
                setter_returned = $hasValue
                socket_option_readback = $readBack
                native_socket_error = $nativeError
                actual_loopback_byte = $true
                packet_headers_observed = $false
              }))
            }
          }
          finally {
            if ($receiver) { $receiver.Dispose() }
            if ($sender) { $sender.Dispose() }
            $listener.Stop()
          }
      - name: Start and remove only a purpose-built blank firmware test VM
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'vs-receiver-probe-' + [guid]::NewGuid().ToString('N')
          $root = Join-Path $env:RUNNER_TEMP $name
          $previous = @(Get-VM | ForEach-Object { $_.Id.ToString() } | Sort-Object)
          if ((Test-Path -LiteralPath $root) -or (Get-VM -Name $name -ErrorAction SilentlyContinue)) {
            throw 'Expected unique fresh private fixture'
          }
          $null = New-Item -ItemType Directory -Path $root
          $vmId = $null
          try {
            $vm = New-VM -Name $name -Path $root -MemoryStartupBytes 256MB -Generation 2 -NoVHD -Force
            $vmId = $vm.Id
            $attachedDisks = @(Get-VMHardDiskDrive -VM $vm)
            $attachedLinks = @(Get-VMNetworkAdapter -VM $vm | Where-Object { $_.SwitchName })
            if ($attachedDisks.Count -ne 0 -or $attachedLinks.Count -ne 0) {
              throw 'The firmware-only fixture must have no disk and no connected network'
            }
            Start-VM -VM $vm
            $vm = Get-VM -Id $vmId
            if ($vm.State -ne 'Running' -or $vm.Generation -ne 2) { throw 'Owned generation 2 firmware did not run' }
            $architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            Write-Output "HYPERV_RECEIVER_FIRMWARE architecture=$architecture state=Running owned_disk_count=0 connected_link_count=0 exact_vm=$vmId"
          }
          finally {
            $probe = Get-VM -Name $name -ErrorAction SilentlyContinue
            if ($probe) {
              $path = [IO.Path]::GetFullPath([string]$probe.ConfigurationLocation)
              $normalizedRoot = [IO.Path]::GetFullPath($root).TrimEnd('\')
              if (($vmId -and $probe.Id -ne $vmId) -or ($path -ne $normalizedRoot -and !$path.StartsWith($normalizedRoot + '\', [StringComparison]::OrdinalIgnoreCase))) {
                throw 'Cannot establish exact VM ownership for cleanup'
              }
              if ($probe.State -ne 'Off') { Stop-VM -VM $probe -TurnOff -Force }
              Remove-VM -VM $probe -Force
            }
            $restored = @(Get-VM | ForEach-Object { $_.Id.ToString() } | Sort-Object)
            if (($restored -join ',') -ne ($previous -join ',')) { throw 'The host VM inventory changed outside the owned fixture' }
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
            Write-Output 'HYPERV_RECEIVER_CLEANUP exact_vm_removed=true vm_inventory_restored=true private_storage_removed=true'
          }
