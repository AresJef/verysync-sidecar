name: Verify macOS ARM64 folder concurrency after startup scans
on:
  push:
    branches: [verify/r23/macarm-folder-readiness]
permissions:
  contents: read
jobs:
  folder-readiness:
    name: Original one- and two-folder concurrency assertions
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: macos-15
    timeout-minutes: 20
    env:
      TEST_TOOLCHAIN: 1.85.0-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare the original native profile and verified official program
        run: |
          git rev-parse HEAD HEAD^{tree}
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          cargo +"$TEST_TOOLCHAIN" fetch --locked
          python scripts/prepare-test-engine.py prepare --package macos-arm64-standard \
            --parent "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Verify ordered concurrency and original file and lifecycle effects
        run: |
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target configuration_engine \
            --test-filter folder_concurrency_cases::native_folder_concurrency_has_ordered_single_and_double_sync_effects \
            --evidence-dir "$RUNNER_TEMP/vs-r23-macarm-folder-readiness"
      - name: Require exact owned executable cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
