name: Verify routed data from the actual candidate package
on:
  push:
    branches: [verify/r23/routed-package]
permissions:
  contents: read
jobs:
  routed:
    name: Packaged VerySync routed data (IPv${{ matrix.family }})
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [4, 6]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          path: candidate
          ref: 4f0cb7254e78364d8b675ed43ee5a36854d919b4
      - name: Build and verify the exact candidate crate
        working-directory: candidate
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/routed-candidate-target"
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 fetch --locked
          cargo +1.85.0 package --offline --locked
          RUSTUP_TOOLCHAIN=1.85.0 python3 -B scripts/publish-github-release.py \
            --metadata ../.github/diagnostics/routed-candidate-package.json \
            --check-package "$CARGO_TARGET_DIR/package/verysync-sidecar-0.1.0-alpha.2.crate"
      - name: Compile the original diagnostic driver against the verified crate contents
        run: |
          mkdir "$RUNNER_TEMP/routed-driver"
          tar -xzf "$CARGO_TARGET_DIR/package/verysync-sidecar-0.1.0-alpha.2.crate" -C "$RUNNER_TEMP/routed-driver"
          cd "$RUNNER_TEMP/routed-driver/verysync-sidecar-0.1.0-alpha.2"
          cp "$GITHUB_WORKSPACE/.github/diagnostics/routed-direct.rs" examples/routed_direct_diagnostic.rs
          cat <<'TOML' >> Cargo.toml

          [[example]]
          name = "routed_direct_diagnostic"
          path = "examples/routed_direct_diagnostic.rs"
          TOML
          cargo +1.85.0 build --locked --offline --example routed_direct_diagnostic
      - name: Prepare and verify the fixed isolated native engine
        working-directory: candidate
        run: >-
          python3 scripts/prepare-test-engine.py prepare --package linux-amd64-standard
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Require authenticated routed bytes, pause, recovery and normal cleanup
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python3 .github/diagnostics/routed-direct.py "$FAMILY" \
            "$CARGO_TARGET_DIR/debug/examples/routed_direct_diagnostic"
      - name: Require exact owned-executable cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        working-directory: candidate
        run: python3 scripts/prepare-test-engine.py check-cleanup
