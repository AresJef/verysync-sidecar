name: Qualify an isolated Windows ARM64 packet observer

on:
  push:
    branches: ['verify/r24/windows-arm64-wintun-qualify']

permissions:
  contents: read

jobs:
  arm64-packet-observer:
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: windows-11-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require a native owned IPv4 and IPv6 SYN and exact cleanup
        shell: pwsh
        run: ./.github/diagnostics/windows-arm64-wintun-qualification.ps1
