name: Engine fixture

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-fixture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  retire-superseded-drafts:
    name: Retire only superseded draft native CI
    if: github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify retirement ownership, source ancestry and preserved outcomes
        run: python -m unittest discover -s scripts/tests -p test_draft_ci_retirement.py
      - name: Cancel only older owned draft ancestor runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cancel-superseded-draft-ci.py
  artifact-catalog:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || (github.head_ref != 'ci/exact-native-retirement-control-20261117-01a1ca9b' && github.head_ref != 'ci/native-observer-diagnosis-20261117-01a1ca9b' && (github.head_ref != 'ci/intel-v27-preparation-window-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/intel-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/compiled-input-resources-v27-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/arm-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/macos-native-timers-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/native-stop-diagnostics-20261117-01a1ca9b' && github.head_ref != 'ci/native-boundary-diagnostics-20261117-01a1ca9b' && github.head_ref != 'test/ftp-anonymous-native-20261117-01a1ca9b' && github.head_ref != 'test/native-sftp-server-identity-20261118-01a1ca9b' && github.head_ref != 'test/native-backend-outage-20261118-01a1ca9b' && github.head_ref != 'test/native-local-announcement-20261118-01a1ca9b' && github.head_ref != 'test/macos-local-announcement-address-20261118-01a1ca9b' && github.head_ref != 'test/native-explicit-tunnel-20261118-01a1ca9b' && github.head_ref != 'test/native-folder-concurrency-current-20261118-01a1ca9b' && github.head_ref != 'test/native-progress-interval-20261118-01a1ca9b' && github.head_ref != 'test/native-incoming-admission-cap-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-timeout-stage-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-prepared-index-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-staged-deadlines-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-linux-cleanup-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-readonly-exit-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-reconciled-caller-20261118-01a1ca9b' && github.head_ref != 'test/native-official-tracker-20261118-01a1ca9b' && github.head_ref != 'test/native-missing-policy-evidence-20261118-01a1ca9b' && github.head_ref != 'test/native-core-preferences-current-20261118-01a1ca9b' && (github.head_ref != 'ci/windows-packet-observer-feasibility-20261118-01a1ca9b' && github.head_ref != 'ci/windows-loopback-header-feasibility-20261118-01a1ca9b') && github.head_ref != 'test/native-lan-bandwidth-20261118-01a1ca9b' && github.head_ref != 'ci/native-temp-advertisement-20261117-01a1ca9b' && github.head_ref != 'test/native-remote-advertisement-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'test/strict-storage-tls-defaults-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && github.head_ref != 'ci/macos-intel-v23-environment-20261117-01a1ca9b' && (github.head_ref != 'ci/macos-observer-activity-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/scoped-observer-resource-v24-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'test/trusted-https-webdav-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository))
    name: Fixed archive catalog (static, no engine execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check every in-scope fixed archive through the public Rust API
        run: cargo +1.85.0 test --features engine-tests,download --test download_catalog --locked -- --nocapture

  fixture:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || !github.event.pull_request.draft || (github.head_ref != 'ci/exact-native-retirement-control-20261117-01a1ca9b' && github.head_ref != 'ci/native-observer-diagnosis-20261117-01a1ca9b' && (github.head_ref != 'ci/intel-v27-preparation-window-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/intel-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/compiled-input-resources-v27-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/arm-native-wait-diagnosis-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/macos-native-timers-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/native-stop-diagnostics-20261117-01a1ca9b' && github.head_ref != 'ci/native-boundary-diagnostics-20261117-01a1ca9b' && github.head_ref != 'test/ftp-anonymous-native-20261117-01a1ca9b' && github.head_ref != 'test/native-sftp-server-identity-20261118-01a1ca9b' && github.head_ref != 'test/native-backend-outage-20261118-01a1ca9b' && github.head_ref != 'test/native-local-announcement-20261118-01a1ca9b' && github.head_ref != 'test/macos-local-announcement-address-20261118-01a1ca9b' && github.head_ref != 'test/native-explicit-tunnel-20261118-01a1ca9b' && github.head_ref != 'test/native-folder-concurrency-current-20261118-01a1ca9b' && github.head_ref != 'test/native-progress-interval-20261118-01a1ca9b' && github.head_ref != 'test/native-incoming-admission-cap-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-timeout-stage-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-prepared-index-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-staged-deadlines-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-linux-cleanup-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-readonly-exit-20261118-01a1ca9b' && github.head_ref != 'test/native-admission-reconciled-caller-20261118-01a1ca9b' && github.head_ref != 'test/native-official-tracker-20261118-01a1ca9b' && github.head_ref != 'test/native-missing-policy-evidence-20261118-01a1ca9b' && github.head_ref != 'test/native-core-preferences-current-20261118-01a1ca9b' && (github.head_ref != 'ci/windows-packet-observer-feasibility-20261118-01a1ca9b' && github.head_ref != 'ci/windows-loopback-header-feasibility-20261118-01a1ca9b') && github.head_ref != 'test/native-lan-bandwidth-20261118-01a1ca9b' && github.head_ref != 'ci/native-temp-advertisement-20261117-01a1ca9b' && github.head_ref != 'test/native-remote-advertisement-20261118-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'test/strict-storage-tls-defaults-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && github.head_ref != 'ci/macos-intel-v23-environment-20261117-01a1ca9b' && (github.head_ref != 'ci/macos-observer-activity-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'ci/scoped-observer-resource-v24-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository) && (github.head_ref != 'test/trusted-https-webdav-20261117-01a1ca9b' || github.event.pull_request.head.repo.full_name != github.repository)))
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    # Source136 Windows native bundles reached cache suites at the65-minute
    # job limit; later required suites and cleanup never completed. Reserve the
    # full bundle allowance; individual operation deadlines and outcome gates
    # remain unchanged. A cancelled/partial bundle still cannot pass acceptance.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-amd64-standard
            runner: macos-15-intel
            rust: x86_64-apple-darwin
          - package: macos-arm64-standard
            runner: macos-15
            rust: aarch64-apple-darwin
          - package: windows-amd64-standard
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
          - package: windows-arm64-standard
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
          - package: linux-amd64-standard
            runner: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
          - package: linux-arm64-standard
            runner: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
      VERYSYNC_TEST_LOCAL_ANNOUNCEMENT: github-actions-isolated-vm
      VERYSYNC_TEST_EXPLICIT_TUNNEL: github-actions-isolated-vm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check extraction and exact process inventory contracts
        run: |
          python -m unittest discover -s scripts/tests -p test_prepare_test_engine.py
          python -m unittest discover -s scripts/tests -p test_prepare_test_examples.py
          python -m unittest discover -s scripts/tests -p test_run_isolated_engine_tests.py
          python -m unittest discover -s scripts/tests -p test_ldap_tls_fixture.py
      - name: Install native Rust toolchain
        run: rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
      - name: Record compiler identity
        run: rustc +"$TEST_TOOLCHAIN" -vV
      - name: Select separate x64 protocol-peer tools on Windows ARM
        if: matrix.package == 'windows-arm64-standard'
        id: storage_tools_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          update-environment: false
      - name: Explicitly prepare private protocol peer tools, separate from native SDK and core
        id: storage_environment
        continue-on-error: true
        env:
          VERYSYNC_STORAGE_BASE_PYTHON: ${{ steps.storage_tools_python.outputs.python-path }}
        run: >-
          python scripts/prepare-storage-test-environment.py
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Fetch locked Rust dependencies before offline runtime isolation
        run: cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Explicitly prepare fixed official test engine
        run: >-
          python scripts/prepare-test-engine.py prepare
          --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}"
          --github-env "${{ github.env }}"
      - name: Run public input and synthetic transport contracts
        run: cargo +"$TEST_TOOLCHAIN" test --lib --test client_contract --test transport_contract --test managed_contract --test events_contract --test devices_contract --test invitations_contract --test network_contract --test sync_observation_contract --test releases --locked
      - name: Explicitly prepare pinned older upgrade-source fixture
        run: >-
          python scripts/prepare-test-engine.py prepare --upgrade-source
          --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}"
          --github-env "${{ github.env }}"
      - name: Check explicit preparation and bounded archive contracts
        run: cargo +"$TEST_TOOLCHAIN" test --features download --lib --test download --test cache --locked
      - name: Build public examples explicitly
        run: >-
          python scripts/prepare-test-examples.py
          --toolchain "$TEST_TOOLCHAIN"
          --github-env "${{ github.env }}"
      - name: Validate the Windows UI probe before the complete lifecycle bundle
        id: native_windows_ui
        continue-on-error: true
        if: startsWith(matrix.package, 'windows-')
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target managed_instance --test-filter restart_preserves_identity_folders_settings_and_samples
          --evidence-dir "${{ runner.temp }}/vs-managed-ui-proxy"
      - name: Verify management, account, license and remote-tunnel boundaries
        id: native_authentication_engine
        continue-on-error: true
