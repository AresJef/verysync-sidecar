name: Engine fixture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-fixture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  artifact-catalog:
    name: Fixed archive catalog (static, no engine execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check every in-scope fixed archive through the public Rust API
        run: cargo +1.85.0 test --features engine-tests,download --test download_catalog --locked -- --nocapture

  fixture:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    # Source abe7 Windows AMD64 reached 55 minutes in the final mechanism probes
    # after product suites completed. Allow the complete required bundle and its
    # cleanup to finish; individual native deadlines and all outcome gates stay.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-amd64-standard
            runner: macos-15-intel
            rust: x86_64-apple-darwin
          - package: macos-arm64-standard
            runner: macos-15
            rust: aarch64-apple-darwin
          - package: windows-amd64-standard
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
          - package: windows-arm64-standard
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
          - package: linux-amd64-standard
            runner: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
          - package: linux-arm64-standard
            runner: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check extraction and exact process inventory contracts
        run: |
          python -m unittest discover -s scripts/tests -p test_prepare_test_engine.py
          python -m unittest discover -s scripts/tests -p test_prepare_test_examples.py
          python -m unittest discover -s scripts/tests -p test_run_isolated_engine_tests.py
          python -m unittest discover -s scripts/tests -p test_ldap_tls_fixture.py
      - name: Install native Rust toolchain
        run: rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
      - name: Record compiler identity
        run: rustc +"$TEST_TOOLCHAIN" -vV
      - name: Select separate x64 protocol-peer tools on Windows ARM
        if: matrix.package == 'windows-arm64-standard'
        id: storage_tools_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          update-environment: false
      - name: Explicitly prepare private protocol peer tools, separate from native SDK and core
        id: storage_environment
        continue-on-error: true
        env:
          VERYSYNC_STORAGE_BASE_PYTHON: ${{ steps.storage_tools_python.outputs.python-path }}
        run: >-
          python scripts/prepare-storage-test-environment.py
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Fetch locked Rust dependencies before offline runtime isolation
        run: cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Explicitly prepare fixed official test engine
        run: >-
          python scripts/prepare-test-engine.py prepare
          --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}"
          --github-env "${{ github.env }}"
      - name: Run public input and synthetic transport contracts
        run: cargo +"$TEST_TOOLCHAIN" test --lib --test client_contract --test transport_contract --test managed_contract --test events_contract --test devices_contract --test invitations_contract --test network_contract --test sync_observation_contract --test releases --locked
      - name: Explicitly prepare pinned older upgrade-source fixture
        run: >-
          python scripts/prepare-test-engine.py prepare --upgrade-source
          --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}"
          --github-env "${{ github.env }}"
      - name: Check explicit preparation and bounded archive contracts
        run: cargo +"$TEST_TOOLCHAIN" test --features download --lib --test download --test cache --locked
      - name: Build public examples explicitly
        run: >-
          python scripts/prepare-test-examples.py
          --toolchain "$TEST_TOOLCHAIN"
          --github-env "${{ github.env }}"
      - name: Validate the Windows UI probe before the complete lifecycle bundle
        id: native_windows_ui
        continue-on-error: true
        if: startsWith(matrix.package, 'windows-')
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target managed_instance --test-filter restart_preserves_identity_folders_settings_and_samples
          --evidence-dir "${{ runner.temp }}/vs-managed-ui-proxy"
      - name: Verify management, account, license and remote-tunnel boundaries
        id: native_authentication_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target authentication_engine --evidence-dir "${{ runner.temp }}/vs-authentication-proxy"
      - name: Explicitly prepare the pinned private public-CA loopback TLS fixture
        id: native_ldap_tls_preparation
        continue-on-error: true
        run: >-
          python scripts/prepare-ldap-tls-fixture.py prepare
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Verify strict public-CA LDAP without system trust modification
        id: native_ldap_trusted_ca_engine
        continue-on-error: true
        timeout-minutes: 4
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target ldap_trusted_ca_engine
          --evidence-dir "${{ runner.temp }}/vs-ldap-trusted-ca-proxy"
      - name: Verify actual sync, selective browse, recovery and bounded transfers
        id: native_sync_observation
        continue-on-error: true
        env:
          VERYSYNC_BANDWIDTH_PHASE: acceptance
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target sync_observation
          --evidence-dir "${{ runner.temp }}/vs-sync-observation-proxy"
      - name: Verify fixed-version upgrades, state restoration and cancellation
        id: native_upgrade_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target upgrade_engine --allow-upgrade-metadata --serve-pinned-upgrade-archive
          --evidence-dir "${{ runner.temp }}/vs-upgrade-proxy"
      - name: Verify mounted resource metadata, checksums and native previews
        id: native_files_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target files_engine
          --evidence-dir "${{ runner.temp }}/vs-file-resources-proxy"
      - name: Verify resource file mutations and exact native directory conditions
        id: native_file_mutation_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target file_mutation_engine
          --evidence-dir "${{ runner.temp }}/vs-file-mutation-proxy"
      - name: Verify bounded file streaming, archive contents and actual cancellation
        id: native_file_transfer_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target file_transfer_engine
          --evidence-dir "${{ runner.temp }}/vs-file-transfer-proxy"
      - name: Verify native host watch-limit observations and explicit refusals
        id: native_host_watch_limit
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target host_control_engine
          --evidence-dir "${{ runner.temp }}/vs-host-watch-limit-observations"
      - name: Verify native browser fallback and released desktop actor in private state
        id: native_browser_engine
        continue-on-error: true
        if: startsWith(matrix.package, 'macos-') || startsWith(matrix.package, 'linux-')
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target browser_engine
          --evidence-dir "${{ runner.temp }}/vs-native-browser-proxy"
      - name: Verify actual version retention, deleted-file restoration and free audit conditions
        id: native_file_history_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target file_history_engine --evidence-dir "${{ runner.temp }}/vs-file-history-proxy"
      - name: Verify explicit core errors, logs, package levels and owned diagnostics
        id: native_maintenance_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target maintenance_engine --evidence-dir "${{ runner.temp }}/vs-maintenance-proxy"
      - name: Verify native Local Sync registration, analysis and explicit data effects
        id: native_local_sync_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_engine --evidence-dir "${{ runner.temp }}/vs-local-sync-proxy"
      - name: Verify actual native-core FTP, SFTP, SMB and WebDAV data effects
        id: native_local_sync_protocol_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_protocol_engine --evidence-dir "${{ runner.temp }}/vs-local-sync-protocols-proxy"
      - name: Verify each protocol's reverse copies, three conflicts and selected data effects
        id: native_local_sync_protocol_advanced_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_protocol_advanced_engine --evidence-dir "${{ runner.temp }}/vs-protocol-advanced-proxy"
      - name: Verify selected actions, reverse copies and actual native two-way conflicts
        id: native_local_sync_advanced_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_advanced_engine --evidence-dir "${{ runner.temp }}/vs-local-sync-advanced-proxy"
      - name: Verify actual inflight Local Sync controls, native events and restart continuity
        id: native_local_sync_runtime_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_runtime_engine --evidence-dir "${{ runner.temp }}/vs-local-sync-runtime-proxy"
      - name: Verify native automatic startup data effects and free schedule guards
        id: native_local_sync_automation_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_automation_engine --evidence-dir "${{ runner.temp }}/vs-local-sync-automation-proxy"
      - name: Verify actual marker and incompatible baseline recovery without implicit execution
        id: native_local_sync_repair_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_repair_engine --evidence-dir "${{ runner.temp }}/vs-local-sync-repair-proxy"
      - name: Verify complete scoped storage configuration and explicit data effects
        id: native_local_sync_configuration_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target local_sync_configuration_engine --evidence-dir "${{ runner.temp }}/vs-local-sync-configuration-proxy"
      - name: Verify actual creation defaults, inheritance and persisted configuration
        id: native_configuration_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target configuration_engine --evidence-dir "${{ runner.temp }}/vs-configuration-proxy"
      - name: Verify public host exit and native descriptor or Job ownership
        id: native_managed_lifetime
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target managed_lifetime --evidence-dir "${{ runner.temp }}/vs-host-lifetime-proxy"
      - name: Exercise public managed startup, shutdown, restart and owned UI observations
        id: native_managed_instance
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target managed_instance --evidence-dir "${{ runner.temp }}/vs-managed-proxy"
      - name: Verify independent auxiliary address and passive owned IPv4 listeners
        id: native_p2p_isolation
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target p2p_isolation --evidence-dir "${{ runner.temp }}/vs-p2p-isolation-proxy"
      - name: Verify public device controls and actual private peer effects
        id: native_devices
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target devices --evidence-dir "${{ runner.temp }}/vs-devices-proxy"
      - name: Verify actual folder offers, persistent ignores and explicit key acceptance
        id: native_invitations
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target invitations --evidence-dir "${{ runner.temp }}/vs-invitations-proxy"
      - name: Verify private TCP, UDP/QUIC, relay and isolated discovery effects
        id: native_network
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target network --allow-private-discovery
          --evidence-dir "${{ runner.temp }}/vs-network-proxy"
      - name: Verify read-only handoff to a fresh third node with the source stopped
        id: native_p2p_three_nodes
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target p2p_three_nodes
          --evidence-dir "${{ runner.temp }}/vs-three-node-proxy"
      - name: Run independent-engine fixture contracts
        id: native_engine_control
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target engine_control --evidence-dir "${{ runner.temp }}/vs-control-proxy"
      - name: Verify native wallpaper source denial without external permission
        id: native_wallpaper_denied
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target wallpaper_engine --evidence-dir "${{ runner.temp }}/vs-wallpaper-denied"
      - name: Verify explicit native wallpaper image and conditional resource
        id: native_wallpaper_resource
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target wallpaper_engine --allow-wallpaper-source
          --evidence-dir "${{ runner.temp }}/vs-wallpaper-resource"
      - name: Exercise public bounded events, gaps, cancellation and actual restart recovery
        id: native_events
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target events --evidence-dir "${{ runner.temp }}/vs-events-proxy"
      - name: Run compiled public examples on an independent engine
        id: native_example_control
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target example_control --evidence-dir "${{ runner.temp }}/vs-examples-proxy"
      - name: Exercise actual scan phase observation, file effects and cancellation
        id: native_operations
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target operations --evidence-dir "${{ runner.temp }}/vs-operations-proxy"
      - name: Exercise real sharing keys, distinct local registrations and loopback effects
        id: native_sharing
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target sharing --evidence-dir "${{ runner.temp }}/vs-sharing-proxy"
      - name: Prepare the official fixed program through Rust and verify actual native startup
        id: native_download_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target download_engine --evidence-dir "${{ runner.temp }}/vs-download-proxy"
      - name: Verify cache reuse, recovery, immutable running programs and independent callers
        id: native_cache_engine
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target cache_engine --evidence-dir "${{ runner.temp }}/vs-cache-proxy"
      - name: Investigate native macOS lifetime mechanisms
        id: native_mechanism_macos
        continue-on-error: true
        if: startsWith(matrix.package, 'macos-')
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --mechanism macos --evidence-dir "${{ runner.temp }}/vs-macos-mechanism-proxy"
      - name: Investigate native Linux lifetime mechanisms
        id: native_mechanism_linux
        continue-on-error: true
        if: startsWith(matrix.package, 'linux-')
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --mechanism linux --evidence-dir "${{ runner.temp }}/vs-linux-mechanism-proxy"
      - name: Investigate native Windows Job lifetime mechanisms
        id: native_mechanism_windows
        continue-on-error: true
        if: startsWith(matrix.package, 'windows-')
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --mechanism windows --evidence-dir "${{ runner.temp }}/vs-windows-mechanism-proxy"
      - name: Confirm no task-owned engine remains
        id: native_cleanup_baseline
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Confirm no pinned older upgrade-source engine remains
        id: native_cleanup_upgrade
        if: always() && env.VERYSYNC_TEST_UPGRADE_SOURCE_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup --upgrade-source
      - name: Remove only this job's private public-CA fixture
        id: native_ldap_tls_cleanup
        if: always()
        run: python scripts/prepare-ldap-tls-fixture.py cleanup --parent "${{ runner.temp }}"
      - name: Require every applicable native suite and exact cleanup
        if: always()
        env:
          NATIVE_STEP_RESULTS: ${{ toJson(steps) }}
          NATIVE_MATRIX_PACKAGE: ${{ matrix.package }}
        run: python scripts/check-native-step-results.py

  device-removal-diagnostic:
    name: Device removal diagnosis only (linux-amd64-standard)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the native Rust toolchain
        run: rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
      - name: Fetch fixed dependencies explicitly
        run: cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare the fixed isolated core explicitly
        run: >-
          python scripts/prepare-test-engine.py prepare --package linux-amd64-standard
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Observe the original device-removal condition with bounded role diagnostics
        id: device_first
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target devices --test-filter actual_device_pause_disconnects
          --evidence-dir "${{ runner.temp }}/vs-device-removal-first"
      - name: Require exact owned-core cleanup before the independent repetition
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Repeat independently without overriding the first outcome
        id: device_second
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target devices --test-filter actual_device_pause_disconnects
          --evidence-dir "${{ runner.temp }}/vs-device-removal-second"
      - name: Verify exact owned-core cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Verify explicit observed-disconnect then single-delete operation separately
        id: device_explicit
        continue-on-error: true
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target devices --test-filter actual_explicit_disconnect_and_remove_preserves_files
          --evidence-dir "${{ runner.temp }}/vs-device-explicit-disconnect-remove"
      - name: Require exact cleanup after the explicit operation
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
      - name: Require both original device conditions; this is not full acceptance
        if: always()
        env:
          FIRST_OUTCOME: ${{ steps.device_first.outcome }}
          SECOND_OUTCOME: ${{ steps.device_second.outcome }}
          EXPLICIT_OUTCOME: ${{ steps.device_explicit.outcome }}
        run: >-
          python -c "import os,sys; sys.exit(0 if all(os.environ[k]=='success' for k in ['FIRST_OUTCOME','SECOND_OUTCOME','EXPLICIT_OUTCOME']) else 1)"


  hardware-diagnostic:
    name: Native hardware diagnosis only (${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-arm64-standard
            runner: macos-15
            rust: aarch64-apple-darwin
          - package: macos-amd64-standard
            runner: macos-15-intel
            rust: x86_64-apple-darwin
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native Rust and fetch dependencies before runtime isolation
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Explicitly prepare the matching fixed private Mac core
        run: >-
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Verify native hardware data and exact observed backend-refusal conditions
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target engine_control --test-filter hardware_effects
          --evidence-dir "${{ runner.temp }}/vs-hardware-component-diagnosis"
      - name: Observe the upstream Darwin CPU prerequisite after the original result
        if: always()
        run: |
          python - <<'PY'
          import json, shutil, subprocess
          binary = shutil.which('sysctl')
          if binary is None:
              raise ValueError('the native sysctl prerequisite is absent')
          result = subprocess.run([binary, '-a'], capture_output=True, timeout=15)
          print(json.dumps({'prerequisite': 'ghw v0.13.0 CPU sysctl -a',
                            'exit_code': result.returncode,
                            'stdout_bytes': len(result.stdout), 'stderr_bytes': len(result.stderr),
                            'permission_error_marker': any(marker in result.stderr.lower() for marker in [b'operation not permitted', b'permission denied']),
                            'native_output_logged': False, 'sdk_runtime_acceptance': False}))
          PY
      - name: Require exact owned-executable cleanup after the original result
        if: always()
        run: python scripts/prepare-test-engine.py check-cleanup

  windows-folder-opener-diagnosis:
    name: Native helper diagnosis (${{ matrix.package }} / ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: windows-386-standard
            runner: windows-2022
            rust: i686-pc-windows-msvc
            target: engine_control
            filter: actual_native_folder_open_requests_capture_exact_owned_target_dispatch
            trace: "0"
          - package: windows-amd64-standard
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
            target: engine_control
            filter: actual_native_folder_open_requests_capture_exact_owned_target_dispatch
            trace: "1"
          - package: windows-arm64-standard
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
            target: engine_control
            filter: actual_native_folder_open_requests_capture_exact_owned_target_dispatch
            trace: "1"
          - package: windows-amd64-standard
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
            target: maintenance_engine
            filter: actual_
            trace: "0"
          - package: windows-arm64-standard
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
            target: maintenance_engine
            filter: actual_
            trace: "0"
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
      VERYSYNC_TEST_OPENER_TRACE: ${{ matrix.trace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require Cargo artifact and separate Winsock preflight contracts
        run: python -m unittest discover -s scripts/tests -p test_run_isolated_engine_tests.py
      - name: Install native Rust and fetch locked dependencies
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Explicitly prepare the matching fixed private core
        run: >-
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Preserve original native effects, strict predicates and deadlines
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target "${{ matrix.target }}"
          --test-filter "${{ matrix.filter }}"
          --evidence-dir "${{ runner.temp }}/vs-windows-folder-opener-diagnosis"
      - name: Require exact owned-executable cleanup after the original result
        if: always()
        run: python scripts/prepare-test-engine.py check-cleanup

  host-watch-limit-positive:
    name: Explicit Linux host watch-limit effects (isolated VM only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TEST_TOOLCHAIN: 1.85.0
      VERYSYNC_TEST_ALLOW_HOST_CONFIGURATION: github-actions-isolated-linux-vm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native Rust and fetch locked dependencies without elevation
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Explicitly prepare fixed private Linux core
        run: >-
          python scripts/prepare-test-engine.py prepare --package linux-amd64-standard
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Compile and identify the exact host test as the normal runner
        run: >-
          python scripts/host-test-cargo.py prepare --toolchain "$TEST_TOOLCHAIN"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Run only the prebuilt pinned privileged case and restore the VM setting
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --cargo "$VERYSYNC_HOST_TEST_CARGO_SHIM" --test-target host_control_engine
          --test-filter privileged_native_watch_limit_is_raised_then_independently_restored
          --evidence-dir "${{ runner.temp }}/vs-host-watch-limit-positive"
      - name: Require exact owned-core cleanup
        if: always()
        run: python scripts/prepare-test-engine.py check-cleanup

  native-browser-fallback:
    name: Native browser fallback (${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: macos-arm64-standard
            runner: macos-15
            rust: aarch64-apple-darwin
          - package: macos-amd64-standard
            runner: macos-15-intel
            rust: x86_64-apple-darwin
          - package: linux-amd64-standard
            runner: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
          - package: linux-arm64-standard
            runner: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require browser wrapper and native outcome-gate contracts
        run: |
          python -m unittest discover -s scripts/tests -p test_run_isolated_engine_tests.py
          python -m unittest discover -s scripts/tests -p test_native_step_results.py
      - name: Install native Rust and fetch dependencies before runtime isolation
        run: |
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare only the matching fixed private program
        run: >-
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.package }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Verify native root exit, exact URL, separate state and continuing actor
        run: >-
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN"
          --test-target browser_engine
          --evidence-dir "${{ runner.temp }}/vs-native-browser-focused"
      - name: Require exact owned-program cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
