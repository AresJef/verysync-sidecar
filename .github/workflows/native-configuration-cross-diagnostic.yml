name: Native configuration checks on Linux and Windows

on:
  push:
    branches: [verify/r24/cross-native-configuration-a710]

permissions:
  contents: read

jobs:
  native:
    name: Native configuration sample (${{ matrix.profile }})
    if: github.repository == 'AresJef/verysync-sidecar' && !github.event.deleted
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-amd64-standard
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - profile: linux-arm64-standard
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu
          - profile: windows-amd64-standard
            runner: windows-2022
            rust_host: x86_64-pc-windows-msvc
          - profile: windows-arm64-standard
            runner: windows-11-arm
            rust_host: aarch64-pc-windows-msvc
    env:
      TEST_TOOLCHAIN: 1.85.0-${{ matrix.rust_host }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: a710b636853993e31853d0a0d7f9f1ff2a75af0c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Require the exact checked-out test source and native compiler
        env:
          NATIVE_HOST: ${{ matrix.rust_host }}
        run: |
          test "$(git rev-parse HEAD)" = a710b636853993e31853d0a0d7f9f1ff2a75af0c
          test "$(git rev-parse 'HEAD^{tree}')" = 09cd69b0937c3db409dcadb285785de1e102315d
          test -z "$(git status --porcelain)"
          rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
          rustc +"$TEST_TOOLCHAIN" -vV
          test "$(rustc +"$TEST_TOOLCHAIN" -vV | sed -n 's/^host: //p')" = "$NATIVE_HOST"
          cargo +"$TEST_TOOLCHAIN" fetch --locked
      - name: Prepare the selected pinned isolated engine
        run: >-
          python scripts/prepare-test-engine.py prepare --package "${{ matrix.profile }}"
          --parent "${{ runner.temp }}" --github-env "$GITHUB_ENV"
      - name: Verify authentic proxy transfer and a separate disabled generation
        run: |
          evidence="$RUNNER_TEMP/vs-authenticated-proxy"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target configuration_engine --test-filter native_socks5_proxy_authentication_transfer_and_explicit_disable_preserve_data \
            --evidence-dir "$evidence"
          grep -F 'native SOCKS5 disabled generation: observer_started_before_restart=true accepted=0 reconnect_observed_seconds=6' "$evidence/configuration-engine.log"
          grep -F 'native SOCKS5 proxy evidence:' "$evidence/configuration-engine.log"
          grep -E '^test result: ok. 1 passed; 0 failed; 0 ignored;' "$evidence/configuration-engine.log"
      - name: Verify signed values through native restart and real transfer
        run: |
          evidence="$RUNNER_TEMP/vs-signed-incoming-config"
          python scripts/run-isolated-engine-tests.py --toolchain "$TEST_TOOLCHAIN" \
            --test-target configuration_engine --test-filter native_signed_incoming_request_budgets_survive_restart_and_real_transfers \
            --evidence-dir "$evidence"
          grep -F 'native signed incoming budget cleanup evidence:' "$evidence/configuration-engine.log"
          grep -E '^test result: ok. 1 passed; 0 failed; 0 ignored;' "$evidence/configuration-engine.log"
      - name: Require exact owned-executable cleanup
        if: always() && env.VERYSYNC_TEST_BINARY != ''
        run: python scripts/prepare-test-engine.py check-cleanup
