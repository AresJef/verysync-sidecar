[package]
name = "verysync-sidecar"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Async Rust control library for the official VerySync program"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AresJef/verysync-sidecar"
documentation = "https://github.com/AresJef/verysync-sidecar#readme"
readme = "README.md"
keywords = ["verysync", "sync", "sidecar", "async"]
categories = ["api-bindings", "asynchronous"]
publish = ["crates-io"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/tests/**/*.rs",
    "/scripts/**/*.py",
    "/scripts/storage-test-requirements.txt",
    "/docs/public/**/*.md",
    "/docs/capabilities.csv",
    "/docs/platforms.csv",
    "/releases/*.json",
    "/README.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
flate2 = { version = "1.1.11", default-features = false, features = ["miniz_oxide"], optional = true }
fs2 = "0.4.3"
percent-encoding = "2.3.2"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream"] }
rmpv = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false, optional = true }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
rawzip = { version = "0.5.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp"] }

[features]
default = ["tls"]
tls = ["reqwest/rustls"]
engine-tests = []
download = ["tls", "dep:flate2", "dep:tar", "dep:rawzip"]

[dev-dependencies]
bzip2 = "0.6.1"
lz4_flex = "0.13.0"
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "xz"] }
snap = "1.1.1"
getrandom = "0.4.3"
rmpv = "1.3.1"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[[test]]
name = "engine_control"
path = "tests/engine_control.rs"
required-features = ["engine-tests"]

[[test]]
name = "managed_instance"
path = "tests/managed_instance.rs"
required-features = ["engine-tests"]

[[test]]
name = "managed_lifetime"
path = "tests/managed_lifetime.rs"
required-features = ["engine-tests"]

[[test]]
name = "events"
path = "tests/events.rs"
required-features = ["engine-tests"]

[[test]]
name = "example_control"
path = "tests/example_control.rs"
required-features = ["engine-tests"]

[[test]]
name = "lifetime_probes"
path = "tests/lifetime_probes.rs"
required-features = ["engine-tests"]

[[test]]
name = "windows_lifetime_probes"
path = "tests/windows_lifetime_probes.rs"
required-features = ["engine-tests"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[[test]]
