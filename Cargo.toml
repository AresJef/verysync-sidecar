[package]
name = "verysync-sidecar"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Async Rust control library for the official VerySync program"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["verysync", "sync", "sidecar", "async"]
categories = ["api-bindings", "asynchronous"]
publish = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "src/**",
    "examples/**",
    "tests/**",
    "docs/public/**",
    "docs/capabilities.csv",
    "docs/platforms.csv",
    "releases/*.json",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
url = "2.5.8"

[features]
engine-tests = []

[dev-dependencies]
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmpv = "1.3.1"
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "fixture_contract"
path = "tests/fixture_contract.rs"
required-features = ["engine-tests"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "warn"
